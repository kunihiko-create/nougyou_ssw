<script>
(function () {
  var SALT = 'xEnMdme9++Cy3RHSOs0iSw==', IV = '3byWdC8ulOaubrrw', ITER = 300000, STORE = 'enc_nougyou_key', AUTH = ['nougyou_auth', '1'];
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function tob64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function decrypt(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(document.getElementById('enc').textContent.trim()));
    }).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html, raw) {
    if (raw) ls(STORE, tob64(raw));
    ls(AUTH[0], AUTH[1]);
    // ページの読み込みが終わってから入れ替える（途中だと前の画面が残るため）
    var swap = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') setTimeout(swap, 0);
    else window.addEventListener('load', function () { setTimeout(swap, 0); }, { once: true });
  }
  function form() {
    document.getElementById('wt').style.display = 'none';
    document.getElementById('box').style.display = 'block';
    document.getElementById('pw').focus();
  }
  if (!window.crypto || !crypto.subtle) {
    document.getElementById('wt').textContent = 'このブラウザでは開けません。新しいブラウザで開いてください。 / Browser ini tidak didukung.';
    return;
  }
  document.getElementById('fm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value, bt = document.getElementById('bt'), er = document.getElementById('er');
    if (!pw) return;
    bt.disabled = true; er.textContent = ''; bt.textContent = '確認中… / Memeriksa…';
    var raw;
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, k, 256);
    }).then(function (bits) { raw = bits; return decrypt(bits); })
      .then(function (html) { show(html, raw); })
      .catch(function () {
        bt.disabled = false; bt.textContent = 'ログイン / Masuk';
        er.textContent = 'パスワードが違います / Kata sandi salah';
        document.getElementById('pw').value = ''; document.getElementById('pw').focus();
      });
  });
  var saved = ls(STORE);
  if (saved) {
    decrypt(b64(saved)).then(function (html) { show(html); }).catch(function () { ls(STORE, null); form(); });
  } else form();
})();
