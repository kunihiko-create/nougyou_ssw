<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農業SSW 試験対策</title>
<style>
  :root {
    --main: #C0392B;
    --main-dark: #96281B;
    --main-light: #fdeceb;
    --main-mid: #f3b8b1;
    --ok: #15803d;
    --ok-light: #dcfce7;
    --ng: #b91c1c;
    --ng-light: #fee2e2;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --line: #e5e7eb;
    --text: #1f2937;
    --text-sub: #6b7280;
    --shadow: 0 4px 20px rgba(0,0,0,0.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Noto Sans JP', sans-serif;
    background: #fdf4f2; color: var(--text); min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; }
  ruby rt { font-size: 0.55em; color: var(--text-sub); }
  .wrap { max-width: 600px; margin: 0 auto; padding: 16px; }

  /* ===== HEADER ===== */
  header {
    background: var(--main); color: white; padding: 12px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 10px rgba(192,57,43,0.35);
  }
  .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-title { font-size: 1.02rem; font-weight: bold; line-height: 1.3; cursor: pointer; }
  .header-title small { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.85; }
  .toggles { display: flex; gap: 6px; flex-shrink: 0; }
  .tg {
    border: 1.5px solid rgba(255,255,255,0.7); background: transparent; color: white;
    border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; font-weight: bold;
  }
  .tg.on { background: white; color: var(--main); border-color: white; }

  /* ===== CARDS / BUTTONS ===== */
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1rem; margin-bottom: 10px; }
  .sub { color: var(--text-sub); font-size: 0.78rem; }
  .btn {
    display: block; width: 100%; border: none; border-radius: 12px; padding: 14px 16px;
    font-size: 0.98rem; font-weight: bold; background: var(--main); color: white;
    transition: transform .1s, background .2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #d1d5db; color: #9ca3af; cursor: default; }
  .btn.sec { background: var(--gray-light); color: var(--text); }
  .btn.ghost { background: white; color: var(--main); border: 2px solid var(--main-mid); }
  .btn rt { color: inherit; opacity: 0.8; }
  .btn small { display: block; font-weight: normal; font-size: 0.72rem; opacity: 0.85; margin-top: 2px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .mt { margin-top: 10px; }

  .menu-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: white; border: 2px solid var(--line); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; color: var(--text);
  }
  .menu-btn:active { background: var(--main-light); }
  .menu-btn .ic { font-size: 1.7rem; width: 40px; text-align: center; flex-shrink: 0; }
  .menu-btn b { display: block; font-size: 0.98rem; }
  .menu-btn span { font-size: 0.75rem; color: var(--text-sub); }

  .due-box {
    background: linear-gradient(135deg, var(--main), var(--main-dark)); color: white;
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .due-num { font-size: 2.2rem; font-weight: bold; line-height: 1.1; }
  .due-box rt { color: rgba(255,255,255,0.85); }
  .due-box .btn { background: white; color: var(--main); margin-top: 12px; }
  .due-box .btn:disabled { background: rgba(255,255,255,0.4); color: white; }

  .stat-row { display: flex; justify-content: space-around; text-align: center; }
  .stat-row b { display: block; font-size: 1.4rem; color: var(--main); }
  .stat-row span { font-size: 0.72rem; color: var(--text-sub); }

  /* category chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 12px; border-radius: 20px; border: 2px solid var(--line); background: white;
    font-size: 0.82rem; font-weight: bold; color: var(--gray);
  }
  .chip.on { background: var(--main); border-color: var(--main); color: white; }
  .chip small { font-weight: normal; opacity: 0.8; }

  /* bars */
  .bar-row { display: grid; grid-template-columns: 7.5em 1fr 3.2em; align-items: center; gap: 8px; font-size: 0.8rem; margin: 7px 0; }
  .bar { height: 10px; background: var(--gray-light); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #f59e0b; border-radius: 6px; }
  .bar i.good { background: var(--ok); }
  .bar i.weak { background: var(--ng); }
  .bar-row .pct { text-align: right; font-weight: bold; }

  /* ===== QUIZ ===== */
  .qbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 0.8rem; }
  .qbar .close { border: none; background: var(--gray-light); border-radius: 20px; padding: 6px 12px; font-weight: bold; color: var(--gray); }
  .timer { font-weight: bold; font-variant-numeric: tabular-nums; background: white; border-radius: 20px; padding: 5px 12px; box-shadow: var(--shadow); }
  .timer.low { color: var(--ng); }
  .progress { height: 6px; background: #f3d6d2; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--main); transition: width .3s; }
  .badge { display: inline-block; background: var(--main-light); color: var(--main-dark); border-radius: 12px; padding: 3px 10px; font-size: 0.72rem; font-weight: bold; margin-bottom: 10px; }
  .qtype { display: inline-block; background: var(--gray-light); color: var(--gray); border-radius: 12px; padding: 3px 10px; font-size: 0.72rem; font-weight: bold; margin-left: 4px; }
  .qtext { font-size: 1.12rem; line-height: 2.0; font-weight: bold; }
  .idn { display: block; color: #2563eb; font-size: 0.84rem; line-height: 1.5; margin-top: 6px; font-weight: normal; }

  .listen { display: flex; gap: 10px; margin-bottom: 14px; }
  .listen button {
    flex: 1; border: none; border-radius: 12px; padding: 14px 8px; font-weight: bold; font-size: 0.95rem;
    background: var(--main-light); color: var(--main-dark);
  }
  .listen button.main { background: var(--main); color: white; font-size: 1.05rem; }
  .warn { background: #fef3c7; color: #92400e; border-radius: 10px; padding: 10px 12px; font-size: 0.8rem; margin-bottom: 12px; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: white; border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px;
    font-size: 1rem; line-height: 1.85; color: var(--text); transition: border-color .15s, background .15s;
  }
  .opt .no {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--gray-light);
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; margin-top: 3px;
  }
  .opt.sel { border-color: var(--main); background: var(--main-light); }
  .opt.sel .no { background: var(--main); color: white; }
  .opt.ok { border-color: var(--ok); background: var(--ok-light); }
  .opt.ok .no { background: var(--ok); color: white; }
  .opt.ng { border-color: var(--ng); background: var(--ng-light); }
  .opt.ng .no { background: var(--ng); color: white; }
  .opt:disabled { cursor: default; }
  .tf { display: flex; gap: 12px; margin-top: 16px; }
  .tf .opt { flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 14px 8px; }
  .tf .mark { font-size: 2.2rem; line-height: 1.1; font-weight: bold; }
  .tf .lbl { font-size: 0.85rem; font-weight: bold; line-height: 1.4; }
  .tf .lbl small { display: block; font-weight: normal; color: var(--text-sub); }

  .fb { margin-top: 16px; border-radius: 14px; padding: 14px; line-height: 1.9; font-size: 0.95rem; }
  .fb.ok { background: var(--ok-light); border: 2px solid #86efac; }
  .fb.ng { background: var(--ng-light); border: 2px solid #fca5a5; }
  .fb .res { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; }
  .fb .ans { font-weight: bold; margin-bottom: 6px; }
  .fb .script { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .fb .script button { border: none; background: var(--main); color: white; border-radius: 14px; padding: 2px 10px; font-size: 0.75rem; margin-left: 6px; }

  .qfoot { display: flex; gap: 10px; margin-top: 16px; }
  .qfoot .btn { flex: 1; }
  .unans { text-align: center; font-size: 0.78rem; color: var(--text-sub); margin-top: 8px; }

  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 14px; }
  .grid button { border: none; border-radius: 6px; padding: 6px 0; font-size: 0.7rem; background: var(--gray-light); color: var(--gray); }
  .grid button.done { background: var(--main-mid); color: var(--main-dark); font-weight: bold; }
  .grid button.cur { outline: 2px solid var(--main); }

  /* ===== RESULT ===== */
  .score { text-align: center; padding: 8px 0 4px; }
  .score .big { font-size: 3rem; font-weight: bold; color: var(--main); line-height: 1.1; }
  .score .big small { font-size: 1.1rem; color: var(--text-sub); }
  .pass { display: inline-block; margin-top: 8px; border-radius: 20px; padding: 5px 16px; font-weight: bold; font-size: 0.9rem; }
  .pass.y { background: var(--ok-light); color: var(--ok); }
  .pass.n { background: var(--ng-light); color: var(--ng); }
  details.wrong { border-top: 1px solid var(--line); padding: 10px 0; }
  details.wrong summary { cursor: pointer; line-height: 1.8; font-size: 0.92rem; list-style: none; }
  details.wrong summary::before { content: '▶ '; color: var(--main); font-size: 0.7rem; }
  details.wrong[open] summary::before { content: '▼ '; }
  details.wrong .body { font-size: 0.88rem; line-height: 1.85; margin-top: 6px; background: var(--gray-light); border-radius: 10px; padding: 10px; }
  .hist { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.85rem; }

  /* ===== LOGIN ===== */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .card { width: 100%; max-width: 380px; text-align: center; }
  #login .logo { font-size: 2.6rem; }
  #login h1 { font-size: 1.15rem; margin: 6px 0 2px; }
  #login input {
    width: 100%; padding: 13px; border: 2px solid var(--line); border-radius: 12px; font-size: 1rem; margin: 16px 0 10px;
  }
  #login input:focus { outline: none; border-color: var(--main); }
  .login-error { color: var(--ng); font-size: 0.82rem; margin-top: 8px; display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: white;
    padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 0.92; }
  a.link { color: var(--main); font-weight: bold; text-decoration: none; }
  .qimg { display: block; max-width: 100%; max-height: 300px; margin: 10px auto 0; border-radius: 8px; background: #fff; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="card">
    <div class="logo">🌾</div>
    <h1>農業SSW 試験対策</h1>
    <div class="sub">Persiapan Ujian SSW Pertanian</div>
    <input type="password" id="pw" placeholder="パスワード / Kata sandi" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn" onclick="doLogin()">ログイン / Masuk</button>
    <div class="login-error" id="loginError">❌ パスワードが違います / Kata sandi salah</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header>
    <div class="header-inner">
      <div class="header-title" onclick="go('home')">🌾 農業SSW 試験対策<small>Persiapan Ujian SSW Pertanian</small></div>
      <div class="toggles">
        <button class="tg" id="tgFuri" onclick="toggleSet('furi')">ふりがな</button>
        <button class="tg" id="tgIdn" onclick="toggleSet('idn')">ID</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// 問題データ：栽培の基本・稲作（オリジナル問題）
// 書き方：漢字《よみ》 でふりがな。t: 'tf'=○×, 'mc'=選択, 'listen'=聴解。tf の a: 0=○, 1=×
window.QB = window.QB || [];
QB.push(
// ===== 栽培の基本 =====
{id:'kh01',c:'kihon',t:'tf',
 q:'光合成《こうごうせい》には、光《ひかり》・二酸化炭素《にさんかたんそ》・水《みず》が必要《ひつよう》である。',
 qi:'Fotosintesis membutuhkan cahaya, karbon dioksida, dan air.',
 a:0,
 e:'正《ただ》しい。植物《しょくぶつ》は光《ひかり》のエネルギーで、二酸化炭素《にさんかたんそ》と水《みず》からでんぷんを作《つく》り、酸素《さんそ》を出《だ》す。酸素《さんそ》は「必要《ひつよう》なもの」ではなく「出《で》てくるもの」。',
 ei:'Benar. Tanaman membuat pati dari karbon dioksida dan air dengan energi cahaya, lalu mengeluarkan oksigen. Oksigen bukan bahan yang dibutuhkan, melainkan hasil yang dikeluarkan.'},
{id:'kh02',c:'kihon',t:'tf',
 q:'植物《しょくぶつ》が葉《は》の気孔《きこう》から水分《すいぶん》を出《だ》すことを、蒸散《じょうさん》という。',
 qi:'Tanaman mengeluarkan air dari stomata daun. Ini disebut transpirasi.',
 a:0,
 e:'正《ただ》しい。蒸散《じょうさん》によって根《ね》から水《みず》を吸《す》い上《あ》げ、葉《は》の温度《おんど》が上《あ》がりすぎるのを防《ふせ》ぐ。',
 ei:'Benar. Dengan transpirasi, tanaman menarik air dari akar dan mencegah suhu daun naik terlalu tinggi.'},
{id:'kh03',c:'kihon',t:'mc',
 q:'次《つぎ》のうち、生殖器官《せいしょくきかん》（子孫《しそん》を残《のこ》すための器官《きかん》）はどれか。',
 qi:'Manakah yang termasuk organ generatif (organ untuk menghasilkan keturunan)?',
 o:['花《はな》','葉《は》','茎《くき》','根《ね》'],
 oi:['Bunga','Daun','Batang','Akar'],
 a:0,
 e:'花《はな》・実《み》・種《たね》が生殖器官《せいしょくきかん》。葉《は》・茎《くき》・根《ね》は栄養器官《えいようきかん》。',
 ei:'Bunga, buah, dan biji adalah organ generatif. Daun, batang, dan akar adalah organ vegetatif.'},
{id:'kh04',c:'kihon',t:'tf',
 q:'栄養成長《えいようせいちょう》とは、花《はな》や実《み》をつくる成長《せいちょう》のことである。',
 qi:'Pertumbuhan vegetatif adalah pertumbuhan untuk membentuk bunga dan buah.',
 a:1,
 e:'まちがい。栄養成長《えいようせいちょう》は葉《は》・茎《くき》・根《ね》を大《おお》きくする成長《せいちょう》。花《はな》・実《み》・種《たね》をつくるのは生殖成長《せいしょくせいちょう》。',
 ei:'Salah. Pertumbuhan vegetatif adalah pertumbuhan daun, batang, dan akar. Pembentukan bunga, buah, dan biji disebut pertumbuhan generatif.'},
{id:'kh05',c:'kihon',t:'mc',
 q:'肥料《ひりょう》の三要素《さんようそ》として正《ただ》しいものはどれか。',
 qi:'Manakah tiga unsur utama pupuk yang benar?',
 o:['窒素《ちっそ》・リン酸《さん》・カリ','窒素《ちっそ》・カルシウム・マグネシウム','鉄《てつ》・リン酸《さん》・カリ'],
 oi:['Nitrogen, fosfat, kalium','Nitrogen, kalsium, magnesium','Besi, fosfat, kalium'],
 a:0,
 e:'肥料《ひりょう》の三要素《さんようそ》は窒素《ちっそ》(N)・リン酸《さん》(P)・カリ(K)。袋《ふくろ》の「10-8-8」はこの順番《じゅんばん》の割合《わりあい》(%)。',
 ei:'Tiga unsur utama pupuk: nitrogen (N), fosfat (P), kalium (K). Angka "10-8-8" di karung menunjukkan persentase dengan urutan ini.'},
{id:'kh06',c:'kihon',t:'mc',
 q:'葉《は》や茎《くき》の成長《せいちょう》を助《たす》け、「葉肥《はごえ》」と呼《よ》ばれる成分《せいぶん》はどれか。',
 qi:'Unsur yang membantu pertumbuhan daun dan batang, disebut "pupuk daun", adalah?',
 o:['窒素《ちっそ》','リン酸《さん》','カリ'],
 oi:['Nitrogen','Fosfat','Kalium'],
 a:0,
 e:'窒素《ちっそ》＝葉肥《はごえ》、リン酸《さん》＝実肥《みごえ》（花《はな》や実《み》）、カリ＝根肥《ねごえ》（根《ね》）と覚《おぼ》える。',
 ei:'Ingat: nitrogen = pupuk daun, fosfat = pupuk buah (bunga & buah), kalium = pupuk akar.'},
{id:'kh07',c:'kihon',t:'mc',
 q:'花《はな》や実《み》をつくるのに大切《たいせつ》で、「実肥《みごえ》」と呼《よ》ばれる成分《せいぶん》はどれか。',
 qi:'Unsur yang penting untuk membentuk bunga dan buah, disebut "pupuk buah", adalah?',
 o:['リン酸《さん》','窒素《ちっそ》','カリ'],
 oi:['Fosfat','Nitrogen','Kalium'],
 a:0,
 e:'リン酸《さん》は花《はな》・実《み》・種《たね》の発育《はついく》を助《たす》ける。窒素《ちっそ》は葉《は》、カリは根《ね》。',
 ei:'Fosfat membantu perkembangan bunga, buah, dan biji. Nitrogen untuk daun, kalium untuk akar.'},
{id:'kh08',c:'kihon',t:'tf',
 q:'窒素《ちっそ》を与《あた》えすぎると、葉《は》や茎《くき》ばかり茂《しげ》り、病気《びょうき》や害虫《がいちゅう》に弱《よわ》くなる。',
 qi:'Jika nitrogen diberikan terlalu banyak, daun dan batang tumbuh lebat saja, dan tanaman menjadi lemah terhadap penyakit dan hama.',
 a:0,
 e:'正《ただ》しい。窒素《ちっそ》が多《おお》すぎると実《み》がつきにくくなり、やわらかい葉《は》に病害虫《びょうがいちゅう》がつきやすい。',
 ei:'Benar. Jika nitrogen berlebihan, buah sulit terbentuk dan daun yang lunak mudah diserang hama dan penyakit.'},
{id:'kh09',c:'kihon',t:'tf',
 q:'元肥《もとごえ》は、作物《さくもつ》を植《う》えたあとに与《あた》える肥料《ひりょう》である。',
 qi:'Pupuk dasar adalah pupuk yang diberikan setelah tanaman ditanam.',
 a:1,
 e:'まちがい。元肥《もとごえ》は植《う》える前《まえ》（種《たね》まきや植《う》え付《つ》けの前《まえ》）に土《つち》に入《い》れる肥料《ひりょう》。植《う》えたあとに与《あた》えるのは追肥《ついひ》。',
 ei:'Salah. Pupuk dasar dimasukkan ke tanah sebelum menanam. Pupuk yang diberikan setelah menanam disebut pupuk susulan.'},
{id:'kh10',c:'kihon',t:'mc',
 q:'作物《さくもつ》が育《そだ》っている途中《とちゅう》に、追加《ついか》で与《あた》える肥料《ひりょう》を何《なん》というか。',
 qi:'Pupuk yang diberikan tambahan saat tanaman sedang tumbuh disebut?',
 o:['追肥《ついひ》','元肥《もとごえ》','堆肥《たいひ》'],
 oi:['Pupuk susulan','Pupuk dasar','Kompos'],
 a:0,
 e:'追肥《ついひ》は生育《せいいく》の途中《とちゅう》で足《た》りない養分《ようぶん》を補《おぎな》う肥料《ひりょう》。堆肥《たいひ》は土《つち》づくりのための有機物《ゆうきぶつ》。',
 ei:'Pupuk susulan menambah nutrisi yang kurang saat pertumbuhan. Kompos adalah bahan organik untuk memperbaiki tanah.'},
{id:'kh11',c:'kihon',t:'tf',
 q:'多《おお》くの作物《さくもつ》は、pH5.5〜6.5くらいの弱酸性《じゃくさんせい》の土《つち》でよく育《そだ》つ。',
 qi:'Banyak tanaman tumbuh baik di tanah yang sedikit asam, sekitar pH 5,5–6,5.',
 a:0,
 e:'正《ただ》しい。日本《にほん》の多《おお》くの作物《さくもつ》に合《あ》うのはpH5.5〜6.5。pH7が中性《ちゅうせい》。日本《にほん》の土《つち》は雨《あめ》が多《おお》く酸性《さんせい》になりやすいので、石灰《せっかい》で調整《ちょうせい》する。',
 ei:'Benar. pH yang cocok untuk sebagian besar tanaman di Jepang adalah 5,5–6,5. pH 7 adalah netral. Tanah di Jepang mudah menjadi asam karena banyak hujan, sehingga disesuaikan dengan kapur.'},
{id:'kh12',c:'kihon',t:'mc',
 q:'酸性《さんせい》になった土《つち》を中和《ちゅうわ》するために使《つか》う資材《しざい》はどれか。',
 qi:'Bahan apa yang digunakan untuk menetralkan tanah yang asam?',
 o:['苦土石灰《くどせっかい》','硫安《りゅうあん》','尿素《にょうそ》'],
 oi:['Kapur dolomit','Amonium sulfat','Urea'],
 a:0,
 e:'苦土石灰《くどせっかい》はアルカリ性《せい》で、酸性《さんせい》の土《つち》を中和《ちゅうわ》する。硫安《りゅうあん》・尿素《にょうそ》は窒素肥料《ちっそひりょう》。',
 ei:'Kapur dolomit bersifat basa dan menetralkan tanah asam. Amonium sulfat dan urea adalah pupuk nitrogen.'},
{id:'kh13',c:'kihon',t:'tf',
 q:'土《つち》のpHが7より小《ちい》さいとき、その土《つち》はアルカリ性《せい》である。',
 qi:'Jika pH tanah lebih kecil dari 7, tanah tersebut bersifat basa (alkali).',
 a:1,
 e:'まちがい。pH7より小《ちい》さい＝酸性《さんせい》、7＝中性《ちゅうせい》、7より大《おお》きい＝アルカリ性《せい》。',
 ei:'Salah. pH kurang dari 7 = asam, 7 = netral, lebih dari 7 = basa.'},
{id:'kh14',c:'kihon',t:'mc',
 q:'団粒構造《だんりゅうこうぞう》の土《つち》の特徴《とくちょう》として正《ただ》しいものはどれか。',
 qi:'Manakah ciri tanah berstruktur remah (granular) yang benar?',
 o:['水《みず》はけと水《みず》もちの両方《りょうほう》が良《よ》い','水《みず》はけが悪《わる》く、いつも水《みず》がたまる','かたくて空気《くうき》が入《はい》らない'],
 oi:['Drainase dan daya simpan air keduanya baik','Drainase buruk, air selalu menggenang','Keras dan udara tidak masuk'],
 a:0,
 e:'団粒構造《だんりゅうこうぞう》は小《ちい》さな土《つち》の粒《つぶ》が集《あつ》まった状態《じょうたい》。すき間《ま》があり、水《みず》はけ・水《みず》もち・通気性《つうきせい》が良《よ》い。堆肥《たいひ》を入《い》れると作《つく》られやすい。',
 ei:'Struktur remah adalah butiran tanah kecil yang berkumpul. Ada celah, sehingga drainase, daya simpan air, dan aerasi baik. Mudah terbentuk jika diberi kompos.'},
{id:'kh15',c:'kihon',t:'tf',
 q:'堆肥《たいひ》を土《つち》に入《い》れると、微生物《びせいぶつ》が増《ふ》え、土《つち》がやわらかくなる。',
 qi:'Jika kompos dimasukkan ke tanah, mikroorganisme bertambah dan tanah menjadi gembur.',
 a:0,
 e:'正《ただ》しい。堆肥《たいひ》は土《つち》の物理性《ぶつりせい》（やわらかさ・水《みず》はけ）と生物性《せいぶつせい》（微生物《びせいぶつ》）を良《よ》くする。',
 ei:'Benar. Kompos memperbaiki sifat fisik tanah (kegemburan, drainase) dan sifat biologisnya (mikroorganisme).'},
{id:'kh16',c:'kihon',t:'mc',
 q:'連作障害《れんさくしょうがい》の説明《せつめい》として正《ただ》しいものはどれか。',
 qi:'Manakah penjelasan yang benar tentang gangguan tanam berulang (renzaku shougai)?',
 o:['同《おな》じ畑《はたけ》で同《おな》じ科《か》の作物《さくもつ》を続《つづ》けて作《つく》ると、育《そだ》ちが悪《わる》くなること','雨《あめ》が何日《なんにち》も続《つづ》いて、作物《さくもつ》が育《そだ》たないこと','機械《きかい》が古《ふる》くなって、作業《さぎょう》ができないこと'],
 oi:['Pertumbuhan memburuk jika tanaman dari famili yang sama ditanam terus di lahan yang sama','Tanaman tidak tumbuh karena hujan berhari-hari','Pekerjaan tidak bisa dilakukan karena mesin sudah tua'],
 a:0,
 e:'同《おな》じ科《か》の作物《さくもつ》を続《つづ》けると、特定《とくてい》の病原菌《びょうげんきん》やセンチュウが増《ふ》え、養分《ようぶん》もかたよる。ナス科《か》・ウリ科《か》で起《お》きやすい。',
 ei:'Jika famili yang sama ditanam terus, patogen dan nematoda tertentu bertambah dan nutrisi menjadi tidak seimbang. Sering terjadi pada famili terung dan labu.'},
{id:'kh17',c:'kihon',t:'tf',
 q:'連作障害《れんさくしょうがい》を防《ふせ》ぐには、ちがう種類《しゅるい》の作物《さくもつ》を順番《じゅんばん》に作《つく》る「輪作《りんさく》」が有効《ゆうこう》である。',
 qi:'Untuk mencegah gangguan tanam berulang, rotasi tanaman (menanam jenis berbeda secara bergiliran) efektif.',
 a:0,
 e:'正《ただ》しい。輪作《りんさく》のほか、接《つ》ぎ木苗《きなえ》を使《つか》う、土《つち》を消毒《しょうどく》する方法《ほうほう》もある。',
 ei:'Benar. Selain rotasi, bisa juga memakai bibit sambung atau mendisinfeksi tanah.'},
{id:'kh18',c:'kihon',t:'mc',
 q:'植物《しょくぶつ》が、葉《は》や茎《くき》になる芽《め》ではなく、花《はな》になる芽《め》を作《つく》りはじめることを何《なん》というか。',
 qi:'Ketika tanaman mulai membentuk tunas bunga (bukan tunas daun/batang), disebut?',
 o:['花芽分化《かがぶんか》','発芽《はつが》','結実《けつじつ》'],
 oi:['Diferensiasi tunas bunga','Perkecambahan','Pembentukan buah'],
 a:0,
 e:'花芽分化《かがぶんか》は温度《おんど》や日《ひ》の長《なが》さ（日長《にっちょう》）の影響《えいきょう》を受《う》ける。発芽《はつが》＝種《たね》から芽《め》が出《で》ること、結実《けつじつ》＝実《み》がなること。',
 ei:'Diferensiasi tunas bunga dipengaruhi suhu dan panjang hari. Perkecambahan = tunas keluar dari biji; pembentukan buah = buah jadi.'},
{id:'kh19',c:'kihon',t:'tf',
 q:'短日植物《たんじつしょくぶつ》とは、日《ひ》が短《みじか》く（夜《よる》が長《なが》く）なると花芽《かが》ができる植物《しょくぶつ》である。',
 qi:'Tanaman hari pendek adalah tanaman yang membentuk tunas bunga ketika hari menjadi pendek (malam menjadi panjang).',
 a:0,
 e:'正《ただ》しい。キク（秋《あき》ギク）、イネ、ダイズなどが短日植物《たんじつしょくぶつ》。夏《なつ》から秋《あき》にかけて夜《よる》が長《なが》くなると花《はな》が咲《さ》く。',
 ei:'Benar. Krisan musim gugur, padi, dan kedelai adalah tanaman hari pendek. Berbunga ketika malam makin panjang dari musim panas ke musim gugur.'},
{id:'kh20',c:'kihon',t:'mc',
 q:'次《つぎ》のうち、短日植物《たんじつしょくぶつ》はどれか。',
 qi:'Manakah yang termasuk tanaman hari pendek?',
 o:['秋《あき》ギク','ホウレンソウ','ダイコン'],
 oi:['Krisan musim gugur','Bayam','Lobak (daikon)'],
 a:0,
 e:'秋《あき》ギクは短日植物《たんじつしょくぶつ》。ホウレンソウは長日植物《ちょうじつしょくぶつ》で、日《ひ》が長《なが》くなると花芽《かが》ができる（とう立《だ》ち）。ダイコンは、気温《きおん》の低《ひく》い日《ひ》が続《つづ》くと花芽《かが》ができる。',
 ei:'Krisan musim gugur adalah tanaman hari pendek. Bayam adalah tanaman hari panjang, membentuk bunga saat hari memanjang (bolting). Lobak (daikon) membentuk bunga jika suhu rendah berlangsung terus.'},
{id:'kh21',c:'kihon',t:'tf',
 q:'ホウレンソウは長日植物《ちょうじつしょくぶつ》で、春《はる》に日《ひ》が長《なが》くなると、とう立《だ》ち（花《はな》の茎《くき》がのびること）しやすい。',
 qi:'Bayam adalah tanaman hari panjang, dan mudah bolting (batang bunga memanjang) ketika hari memanjang di musim semi.',
 a:0,
 e:'正《ただ》しい。とう立《だ》ちすると葉《は》がかたくなり、商品《しょうひん》の価値《かち》が下《さ》がる。',
 ei:'Benar. Jika bolting, daun menjadi keras dan nilai jualnya turun.'},
{id:'kh22',c:'kihon',t:'tf',
 q:'直《じか》まき（直播《ちょくはん》）とは、苗《なえ》を育《そだ》ててから畑《はたけ》に植《う》える方法《ほうほう》である。',
 qi:'Tanam benih langsung adalah cara menanam setelah bibit disemai terlebih dahulu.',
 a:1,
 e:'まちがい。直《じか》まきは畑《はたけ》に直接《ちょくせつ》種《たね》をまく方法《ほうほう》。苗《なえ》を育《そだ》ててから植《う》えるのは移植栽培《いしょくさいばい》。',
 ei:'Salah. Tanam langsung adalah menabur benih langsung di lahan. Menyemai bibit lalu memindahkannya disebut budidaya pindah tanam.'},
{id:'kh23',c:'kihon',t:'mc',
 q:'光《ひかり》があると発芽《はつが》しやすい「好光性種子《こうこうせいしゅし》」はどれか。',
 qi:'Manakah "benih yang berkecambah dalam terang" (butuh cahaya untuk berkecambah)?',
 o:['レタス','ダイコン','カボチャ'],
 oi:['Selada','Lobak (daikon)','Labu'],
 a:0,
 e:'レタス・ニンジン・シソなどは好光性種子《こうこうせいしゅし》。ダイコン・カボチャ・トマトなどは光《ひかり》があると発芽《はつが》しにくい嫌光性種子《けんこうせいしゅし》。',
 ei:'Selada, wortel, dan shiso adalah benih yang butuh cahaya. Daikon, labu, dan tomat adalah benih yang berkecambah dalam gelap.'},
{id:'kh24',c:'kihon',t:'tf',
 q:'好光性種子《こうこうせいしゅし》は、種《たね》をまいたあと、土《つち》を厚《あつ》くかける。',
 qi:'Benih yang butuh cahaya ditutup tanah tebal setelah ditabur.',
 a:1,
 e:'まちがい。光《ひかり》が必要《ひつよう》なので、土《つち》はうすくかけるか、ほとんどかけない。',
 ei:'Salah. Karena butuh cahaya, tanah penutupnya tipis atau hampir tidak ditutup.'},
{id:'kh25',c:'kihon',t:'mc',
 q:'育苗《いくびょう》（苗《なえ》を育《そだ》てること）の利点《りてん》として正《ただ》しいものはどれか。',
 qi:'Manakah keuntungan pembibitan (menyemai bibit) yang benar?',
 o:['苗《なえ》を集《あつ》めて管理《かんり》でき、畑《はたけ》を効率《こうりつ》よく使《つか》える','病気《びょうき》に絶対《ぜったい》にならない','肥料《ひりょう》がまったくいらない'],
 oi:['Bibit bisa dikelola terpusat dan lahan dipakai secara efisien','Tanaman pasti tidak akan sakit','Sama sekali tidak perlu pupuk'],
 a:0,
 e:'育苗《いくびょう》すると、小《ちい》さい時期《じき》をせまい場所《ばしょ》で管理《かんり》でき、畑《はたけ》は前《まえ》の作物《さくもつ》に使《つか》える。「絶対《ぜったい》」「まったく」は試験《しけん》でまちがいのことが多《おお》い。',
 ei:'Dengan pembibitan, tanaman kecil dikelola di tempat sempit, dan lahan bisa dipakai tanaman sebelumnya. Kata "pasti" dan "sama sekali" sering menandakan jawaban salah.'},
{id:'kh26',c:'kihon',t:'mc',
 q:'土《つち》の中《なか》の水分《すいぶん》を測《はか》る道具《どうぐ》はどれか。',
 qi:'Alat apa yang digunakan untuk mengukur kadar air di dalam tanah?',
 o:['土壌水分計《どじょうすいぶんけい》（テンシオメーター）','照度計《しょうどけい》','最高最低温度計《さいこうさいていおんどけい》'],
 oi:['Pengukur kelembapan tanah (tensiometer)','Pengukur intensitas cahaya (lux meter)','Termometer maksimum-minimum'],
 a:0,
 e:'テンシオメーターは土《つち》の水分《すいぶん》の状態《じょうたい》を測《はか》る。照度計《しょうどけい》は光《ひかり》の強《つよ》さ、最高最低温度計《さいこうさいていおんどけい》は一日《いちにち》の最高《さいこう》・最低気温《さいていきおん》を測《はか》る。',
 ei:'Tensiometer mengukur kondisi air tanah. Lux meter mengukur kekuatan cahaya; termometer maks-min mengukur suhu tertinggi dan terendah dalam sehari.'},
{id:'kh27',c:'kihon',t:'mc',
 q:'粘土《ねんど》が多《おお》い土《つち》の特徴《とくちょう》として正《ただ》しいものはどれか。',
 qi:'Manakah ciri tanah yang banyak mengandung liat yang benar?',
 o:['水《みず》もちは良《よ》いが、水《みず》はけが悪《わる》い','水《みず》はけが良《よ》く、すぐ乾《かわ》く','肥料《ひりょう》をまったく保《たも》てない'],
 oi:['Daya simpan air baik, tetapi drainase buruk','Drainase baik dan cepat kering','Sama sekali tidak bisa menahan pupuk'],
 a:0,
 e:'粘土《ねんど》が多《おお》い土《つち》は水《みず》や肥料《ひりょう》をよく保《たも》つが、水《みず》はけが悪《わる》い。砂《すな》が多《おお》い土《つち》は水《みず》はけが良《よ》いが乾《かわ》きやすい。',
 ei:'Tanah liat menahan air dan pupuk dengan baik, tetapi drainasenya buruk. Tanah berpasir drainasenya baik tetapi mudah kering.'},
{id:'kh28',c:'kihon',t:'tf',
 q:'耕《たがや》す（耕《こう》うん）作業《さぎょう》は、主《おも》に土《つち》のpHを変《か》えるために行《おこな》う。',
 qi:'Membajak (mengolah tanah) terutama dilakukan untuk mengubah pH tanah.',
 a:1,
 e:'まちがい。耕《こう》うんは土《つち》をやわらかくし、空気《くうき》を入《い》れ、根《ね》がのびやすくする（物理性《ぶつりせい》の改良《かいりょう》）。pHを変《か》えるのは石灰《せっかい》など（化学性《かがくせい》の改良《かいりょう》）。',
 ei:'Salah. Membajak membuat tanah gembur, memasukkan udara, dan memudahkan akar tumbuh (perbaikan sifat fisik). Yang mengubah pH adalah kapur dll. (perbaikan sifat kimia).'},

// ===== 稲作 =====
{id:'in01',c:'ine',t:'mc',
 q:'アジアで作《つく》られている稲《いね》の主《おも》な種類《しゅるい》はどれか。',
 qi:'Jenis utama padi yang ditanam di Asia adalah?',
 o:['ジャポニカ種《しゅ》とインディカ種《しゅ》','ジャポニカ種《しゅ》とアラビカ種《しゅ》','インディカ種《しゅ》とロブスタ種《しゅ》'],
 oi:['Japonica dan Indica','Japonica dan Arabika','Indica dan Robusta'],
 a:0,
 e:'アジアの稲《いね》はジャポニカ種《しゅ》（短《みじか》く丸《まる》い粒《つぶ》）とインディカ種《しゅ》（細長《ほそなが》い粒《つぶ》）。アラビカ・ロブスタはコーヒーの種類《しゅるい》。',
 ei:'Padi Asia: Japonica (butir pendek bulat) dan Indica (butir ramping panjang). Arabika dan Robusta adalah jenis kopi.'},
{id:'in02',c:'ine',t:'tf',
 q:'日本《にほん》で主《おも》に作《つく》られている稲《いね》は、ジャポニカ種《しゅ》である。',
 qi:'Padi yang terutama ditanam di Jepang adalah jenis Japonica.',
 a:0,
 e:'正《ただ》しい。ジャポニカ種《しゅ》は粘《ねば》りがあり、日本《にほん》のご飯《はん》に向《む》いている。インドネシアで多《おお》いのはインディカ種《しゅ》。',
 ei:'Benar. Japonica pulen dan cocok untuk nasi Jepang. Di Indonesia, yang banyak adalah Indica.'},
{id:'in03',c:'ine',t:'mc',
 q:'もみから、もみがらを取《と》り除《のぞ》いたものを何《なん》というか。',
 qi:'Gabah yang sekamnya sudah dibuang disebut?',
 o:['玄米《げんまい》','白米《はくまい》','ぬか'],
 oi:['Beras pecah kulit (beras cokelat)','Beras putih','Dedak'],
 a:0,
 e:'もみ → もみすり → 玄米《げんまい》 → 精米《せいまい》 → 白米《はくまい》。精米《せいまい》で出《で》る粉《こな》がぬか。',
 ei:'Gabah → dikupas → beras cokelat → digiling/disosoh → beras putih. Bubuk yang keluar saat penyosohan adalah dedak.'},
{id:'in04',c:'ine',t:'tf',
 q:'玄米《げんまい》を精米《せいまい》して、ぬかを取《と》り除《のぞ》いたものが白米《はくまい》である。',
 qi:'Beras putih adalah beras cokelat yang disosoh dan dedaknya dibuang.',
 a:0,
 e:'正《ただ》しい。もみがらを取《と》るのは「もみすり」、ぬかを取《と》るのは「精米《せいまい》」。',
 ei:'Benar. Membuang sekam disebut "momisuri" (pengupasan), membuang dedak disebut "seimai" (penyosohan).'},
{id:'in05',c:'ine',t:'mc',
 q:'塩水《えんすい》を使《つか》って、良《よ》い種《たね》もみを選《えら》ぶ方法《ほうほう》を何《なん》というか。',
 qi:'Cara memilih benih gabah yang baik dengan air garam disebut?',
 o:['塩水選《えんすいせん》','浸種《しんしゅ》','催芽《さいが》'],
 oi:['Seleksi air garam','Perendaman benih','Pemeraman (memicu kecambah)'],
 a:0,
 e:'塩水選《えんすいせん》で重《おも》く中身《なかみ》のつまった種《たね》もみを選《えら》ぶ。浸種《しんしゅ》＝水《みず》に浸《つ》けて吸水《きゅうすい》させること、催芽《さいが》＝芽《め》を少《すこ》し出《だ》させること。',
 ei:'Seleksi air garam memilih benih yang berat dan berisi. Perendaman = merendam agar menyerap air; pemeraman = membuat tunas sedikit keluar.'},
{id:'in06',c:'ine',t:'tf',
 q:'塩水選《えんすいせん》では、塩水《えんすい》に浮《う》いた種《たね》もみを使《つか》う。',
 qi:'Dalam seleksi air garam, benih gabah yang mengapung dipakai.',
 a:1,
 e:'まちがい。沈《しず》んだ重《おも》い種《たね》もみが良《よ》い種《たね》。浮《う》いたものは中身《なかみ》が少《すく》ないので使《つか》わない。選《えら》んだあとは水《みず》でよく洗《あら》う。',
 ei:'Salah. Benih yang tenggelam (berat) adalah benih yang baik. Yang mengapung isinya sedikit, tidak dipakai. Setelah dipilih, dicuci bersih dengan air.'},
{id:'in07',c:'ine',t:'mc',
 q:'種《たね》もみの浸種《しんしゅ》の目安《めやす》は、水温《すいおん》×日数《にっすう》の合計《ごうけい》（積算温度《せきさんおんど》）でおよそ何《なん》℃か。',
 qi:'Patokan perendaman benih gabah adalah total suhu air × jumlah hari (suhu akumulasi) sekitar berapa °C?',
 o:['約《やく》100℃','約《やく》20℃','約《やく》500℃'],
 oi:['Sekitar 100°C','Sekitar 20°C','Sekitar 500°C'],
 a:0,
 e:'積算《せきさん》で約《やく》100℃が目安《めやす》。たとえば水温《すいおん》10℃なら約《やく》10日、水温《すいおん》15℃なら約《やく》7日。',
 ei:'Patokannya sekitar 100°C akumulasi. Misalnya, suhu air 10°C → sekitar 10 hari; 15°C → sekitar 7 hari.'},
{id:'in08',c:'ine',t:'mc',
 q:'種《たね》もみを消毒《しょうどく》する主《おも》な目的《もくてき》はどれか。',
 qi:'Apa tujuan utama mendisinfeksi benih gabah?',
 o:['種《たね》についた病原菌《びょうげんきん》による病気《びょうき》を防《ふせ》ぐため','発芽《はつが》を遅《おく》らせるため','もみの色《いろ》をきれいにするため'],
 oi:['Mencegah penyakit dari patogen yang menempel pada benih','Memperlambat perkecambahan','Membuat warna gabah bagus'],
 a:0,
 e:'ばか苗病《なえびょう》やいもち病《びょう》などは種《たね》から広《ひろ》がるので、種子消毒《しゅししょうどく》をする（薬剤《やくざい》や温湯《おんとう》で）。',
 ei:'Penyakit seperti bakanae dan blas menyebar dari benih, jadi benih didisinfeksi (dengan obat atau air panas).'},
{id:'in09',c:'ine',t:'mc',
 q:'稲《いね》の苗《なえ》を田《た》んぼに植《う》える機械《きかい》はどれか。',
 qi:'Mesin apa yang digunakan untuk menanam bibit padi di sawah?',
 o:['田植機《たうえき》','コンバイン','ロータリー（耕《こう》うん機《き》）'],
 oi:['Mesin tanam padi (rice transplanter)','Combine harvester','Rotary (mesin pengolah tanah)'],
 a:0,
 e:'田植機《たうえき》＝苗《なえ》を植《う》える、コンバイン＝刈《か》り取《と》りと脱穀《だっこく》、ロータリー＝トラクターにつけて土《つち》を耕《たがや》す。',
 ei:'Rice transplanter = menanam bibit; combine = memanen dan merontokkan; rotary = dipasang di traktor untuk mengolah tanah.'},
{id:'in10',c:'ine',t:'mc',
 q:'稲《いね》を刈《か》り取《と》り、同時《どうじ》に脱穀《だっこく》（もみを穂《ほ》から外《はず》すこと）もする機械《きかい》はどれか。',
 qi:'Mesin yang memotong padi sekaligus merontokkan gabah dari malainya adalah?',
 o:['コンバイン','バインダー','田植機《たうえき》'],
 oi:['Combine harvester','Binder (pemotong & pengikat)','Mesin tanam padi'],
 a:0,
 e:'コンバインは刈《か》り取《と》り・脱穀《だっこく》・選別《せんべつ》を一度《いちど》に行《おこな》う。バインダーは刈《か》り取《と》って束《たば》にするだけ。',
 ei:'Combine memotong, merontokkan, dan menyortir sekaligus. Binder hanya memotong dan mengikat menjadi ikatan.'},
{id:'in11',c:'ine',t:'tf',
 q:'代《しろ》かきは、田《た》んぼに水《みず》を入《い》れて土《つち》を細《こま》かく砕《くだ》き、平《たい》らにする作業《さぎょう》である。',
 qi:'Shirokaki adalah pekerjaan memasukkan air ke sawah, menghancurkan tanah menjadi halus, dan meratakannya.',
 a:0,
 e:'正《ただ》しい。代《しろ》かきで田植《たう》えがしやすくなり、水《みず》もれや雑草《ざっそう》も減《へ》る。',
 ei:'Benar. Dengan shirokaki, penanaman jadi mudah, kebocoran air dan gulma berkurang.'},
{id:'in12',c:'ine',t:'mc',
 q:'稲作《いなさく》の「中干《なかぼ》し」の目的《もくてき》として正《ただ》しいものはどれか。',
 qi:'Apa tujuan "nakaboshi" (pengeringan sawah di tengah musim) yang benar?',
 o:['田《た》んぼの水《みず》を抜《ぬ》いて根《ね》に酸素《さんそ》を与《あた》え、むだな分《ぶん》げつをおさえる','雑草《ざっそう》を増《ふ》やす','肥料《ひりょう》を流《なが》して捨《す》てる'],
 oi:['Mengeringkan sawah agar akar mendapat oksigen dan menekan anakan yang tidak berguna','Menambah gulma','Membuang pupuk dengan mengalirkannya'],
 a:0,
 e:'中干《なかぼ》しは田《た》んぼの水《みず》を抜《ぬ》いて土《つち》にひびを入《い》れる作業《さぎょう》。根《ね》が丈夫《じょうぶ》になり、穂《ほ》をつけない分《ぶん》げつ（無効分《むこうぶん》げつ）をおさえる。',
 ei:'Nakaboshi adalah mengeringkan sawah sampai tanah retak. Akar menjadi kuat dan anakan yang tidak menghasilkan malai ditekan.'},
{id:'in13',c:'ine',t:'tf',
 q:'収穫《しゅうかく》したばかりのもみは水分《すいぶん》が多《おお》いので、乾燥機《かんそうき》で水分《すいぶん》14〜15%くらいまで乾《かわ》かす。',
 qi:'Gabah yang baru dipanen kadar airnya tinggi, sehingga dikeringkan dengan mesin pengering sampai kadar air sekitar 14–15%.',
 a:0,
 e:'正《ただ》しい。収穫《しゅうかく》直後《ちょくご》は20〜27%くらいの水分《すいぶん》がある。そのままだとカビや変質《へんしつ》の原因《げんいん》になる。',
 ei:'Benar. Setelah dipanen, kadar airnya sekitar 20–27%. Jika dibiarkan, bisa berjamur dan rusak.'},
{id:'in14',c:'ine',t:'mc',
 q:'稲《いね》の「分《ぶん》げつ」とは何《なに》か。',
 qi:'Apa yang dimaksud dengan "bunketsu" pada padi?',
 o:['株元《かぶもと》から新《あたら》しい茎《くき》が出《で》ること','穂《ほ》が出《で》ること','葉《は》が枯《か》れること'],
 oi:['Batang baru keluar dari pangkal rumpun (anakan)','Malai keluar','Daun mengering'],
 a:0,
 e:'分《ぶん》げつ＝株《かぶ》が増《ふ》えること（anakan）。穂《ほ》が出《で》ることは出穂《しゅっすい》。',
 ei:'Bunketsu = pertambahan anakan. Keluarnya malai disebut shussui (heading).'},
{id:'in15',c:'ine',t:'mc',
 q:'稲《いね》の穂《ほ》が出《で》る時期《じき》を何《なん》というか。',
 qi:'Masa ketika malai padi keluar disebut?',
 o:['出穂期《しゅっすいき》','分《ぶん》げつ期《き》','育苗期《いくびょうき》'],
 oi:['Masa keluar malai (heading)','Masa anakan','Masa pembibitan'],
 a:0,
 e:'出穂期《しゅっすいき》のころに花《はな》が咲《さ》いて受粉《じゅふん》する。この時期《じき》は水《みず》を切《き》らさないことが大切《たいせつ》。',
 ei:'Sekitar masa heading, bunga mekar dan terjadi penyerbukan. Pada masa ini penting agar air tidak kurang.'},
{id:'in16',c:'ine',t:'tf',
 q:'飼料用米《しりょうようまい》は、人《ひと》が食《た》べるための米《こめ》である。',
 qi:'Beras pakan adalah beras untuk dimakan manusia.',
 a:1,
 e:'まちがい。飼料用米《しりょうようまい》は牛《うし》・豚《ぶた》・鶏《にわとり》などの家畜《かちく》のえさにする米《こめ》。収量《しゅうりょう》が多《おお》い品種《ひんしゅ》が使《つか》われる。',
 ei:'Salah. Beras pakan adalah beras untuk pakan ternak seperti sapi, babi, dan ayam. Varietas dengan hasil tinggi digunakan.'},
{id:'in17',c:'ine',t:'mc',
 q:'次《つぎ》のうち、稲《いね》の代表的《だいひょうてき》な病気《びょうき》はどれか。',
 qi:'Manakah penyakit utama pada padi?',
 o:['いもち病《びょう》','黒星病《くろほしびょう》','うどんこ病《びょう》'],
 oi:['Penyakit blas','Penyakit kudis hitam (pada pir/apel)','Penyakit embun tepung'],
 a:0,
 e:'いもち病《びょう》は稲《いね》の最《もっと》も重要《じゅうよう》な病気《びょうき》。低温《ていおん》・多湿《たしつ》・窒素《ちっそ》の与《あた》えすぎで出《で》やすい。黒星病《くろほしびょう》はナシなど、うどんこ病《びょう》は野菜《やさい》や果樹《かじゅ》に多《おお》い。',
 ei:'Blas adalah penyakit terpenting padi. Mudah muncul saat suhu rendah, lembap, dan nitrogen berlebih. Kudis hitam pada pir dll., embun tepung banyak pada sayur dan buah.'},
{id:'in18',c:'ine',t:'tf',
 q:'田植《たう》えのあと寒《さむ》い日《ひ》は、水《みず》を深《ふか》くして苗《なえ》を寒《さむ》さから守《まも》る。',
 qi:'Pada hari dingin setelah tanam, air sawah dibuat dalam untuk melindungi bibit dari dingin.',
 a:0,
 e:'正《ただ》しい。水《みず》は空気《くうき》より温度《おんど》が変《か》わりにくいので、深水《ふかみず》にすると苗《なえ》を保温《ほおん》できる。',
 ei:'Benar. Suhu air lebih stabil daripada udara, jadi air yang dalam menjaga kehangatan bibit.'},
{id:'in19',c:'ine',t:'mc',
 q:'稲《いね》の苗《なえ》を育《そだ》てるときに使《つか》う、浅《あさ》い箱《はこ》を何《なん》というか。',
 qi:'Kotak dangkal yang dipakai untuk menyemai bibit padi disebut?',
 o:['育苗箱《いくびょうばこ》','収穫《しゅうかく》コンテナ','肥料袋《ひりょうぶくろ》'],
 oi:['Kotak persemaian','Kontainer panen','Karung pupuk'],
 a:0,
 e:'育苗箱《いくびょうばこ》に土《つち》と種《たね》もみを入《い》れて苗《なえ》を育《そだ》て、そのまま田植機《たうえき》にのせて植《う》える。',
 ei:'Kotak persemaian diisi tanah dan benih, bibit disemai, lalu langsung dipasang di mesin tanam.'},
{id:'in20',c:'ine',t:'mc',
 q:'浸種《しんしゅ》のあと、ぬるい水《みず》で種《たね》もみの芽《め》を少《すこ》しだけ出《だ》させる作業《さぎょう》を何《なん》というか。',
 qi:'Setelah perendaman, pekerjaan membuat tunas benih sedikit keluar dengan air hangat disebut?',
 o:['催芽《さいが》','中干《なかぼ》し','代《しろ》かき'],
 oi:['Pemeraman (memicu kecambah)','Pengeringan tengah musim','Pelumpuran sawah'],
 a:0,
 e:'催芽《さいが》で芽《め》の長《なが》さを1mmくらい（はと胸《むね》）にそろえると、発芽《はつが》がそろう。',
 ei:'Dengan pemeraman, panjang tunas diseragamkan sekitar 1 mm ("dada burung dara") sehingga perkecambahan seragam.'}
);

{id:'ys05',c:'yasai',t:'tf',

{id:'ys06',c:'yasai',t:'tf',

 oi:['Mulsa transparan','Mulsa hitam','Mulsa hitam-putih (perak)'],
 a:0,
 e:'透明《とうめい》マルチは光《ひかり》を通《とお》すので地温《ちおん》がいちばん上《あ》がる。ただし雑草《ざっそう》が生《は》えやすい。黒《くろ》マルチは雑草《ざっそう》をおさえる。白黒《しろくろ》・シルバーは地温《ちおん》の上昇《じょうしょう》をおさえる（夏《なつ》向《む》き）。',
 ei:'Mulsa transparan meneruskan cahaya sehingga suhu tanah paling naik, tetapi gulma mudah tumbuh. Mulsa hitam menekan gulma. Mulsa putih/perak menahan kenaikan suhu tanah (untuk musim panas).'},
{id:'ys09',c:'yasai',t:'tf',
 q:'黒《くろ》マルチは光《ひかり》を通《とお》さないので、雑草《ざっそう》をおさえる効果《こうか》がある。',
 qi:'Mulsa hitam tidak meneruskan cahaya, sehingga efektif menekan gulma.',
 a:0,
 e:'正《ただ》しい。雑草《ざっそう》は光《ひかり》がないと育《そだ》たない。地温《ちおん》もある程度《ていど》上《あ》がる。',
 ei:'Benar. Gulma tidak bisa tumbuh tanpa cahaya. Suhu tanah juga naik sampai batas tertentu.'},
{id:'ys10',c:'yasai',t:'mc',
 q:'畑《はたけ》でトンネル（小《ちい》さいアーチ型《がた》のフィルム）をかける主《おも》な目的《もくてき》はどれか。',
 qi:'Apa tujuan utama memasang terowongan (film kecil berbentuk lengkung) di ladang?',
 o:['保温《ほおん》して寒《さむ》さから守《まも》る','水《みず》やりをしなくてよくする','肥料《ひりょう》の代《か》わりにする'],
 oi:['Menjaga kehangatan dan melindungi dari dingin','Agar tidak perlu menyiram','Sebagai pengganti pupuk'],
 a:0,
 e:'トンネルは保温《ほおん》・霜《しも》よけ・防虫《ぼうちゅう》（防虫《ぼうちゅう》ネットの場合《ばあい》）のために使《つか》う。晴《は》れた日《ひ》は中《なか》が暑《あつ》くなるので換気《かんき》が必要《ひつよう》。',
 ei:'Terowongan dipakai untuk menjaga kehangatan, menahan embun beku, dan mencegah serangga (jika jaring). Saat cerah, bagian dalam panas sehingga perlu ventilasi.'},
{id:'ys11',c:'yasai',t:'mc',
 q:'収穫《しゅうかく》した野菜《やさい》を「予冷《よれい》」する目的《もくてき》はどれか。',
 qi:'Apa tujuan "prapendinginan" (yorei) sayuran yang sudah dipanen?',
 o:['野菜《やさい》の温度《おんど》を下《さ》げて、鮮度《せんど》を保《たも》つ','野菜《やさい》を凍《こお》らせる','野菜《やさい》を甘《あま》くする'],
 oi:['Menurunkan suhu sayuran untuk menjaga kesegaran','Membekukan sayuran','Membuat sayuran manis'],
 a:0,
 e:'予冷《よれい》で野菜《やさい》の呼吸《こきゅう》をおさえ、しおれや傷《いた》みを防《ふせ》ぐ。凍《こお》らせるわけではない。',
 ei:'Prapendinginan menekan respirasi sayuran sehingga mencegah layu dan busuk. Bukan untuk membekukan.'},
{id:'ys12',c:'yasai',t:'tf',
 q:'葉物野菜《はものやさい》は、気温《きおん》の高《たか》い昼《ひる》に収穫《しゅうかく》すると鮮度《せんど》が保《たも》ちやすい。',
 qi:'Sayuran daun lebih mudah dijaga kesegarannya jika dipanen siang hari saat suhu tinggi.',
 a:1,
 e:'まちがい。気温《きおん》の低《ひく》い朝《あさ》に収穫《しゅうかく》するほうが、しおれにくく鮮度《せんど》が保《たも》ちやすい。',
 ei:'Salah. Memanen pagi hari saat suhu rendah lebih baik karena tidak mudah layu dan kesegaran terjaga.'},
{id:'ys13',c:'yasai',t:'mc',
 q:'ホウレンソウの収穫《しゅうかく》の目安《めやす》として正《ただ》しいものはどれか。',
 qi:'Manakah patokan panen bayam yang benar?',
 o:['草丈《くさたけ》が20〜25cmくらい','草丈《くさたけ》が5cmくらい','草丈《くさたけ》が1mくらい'],
 oi:['Tinggi tanaman sekitar 20–25 cm','Tinggi tanaman sekitar 5 cm','Tinggi tanaman sekitar 1 m'],
 a:0,
 e:'ホウレンソウは草丈《くさたけ》20〜25cmくらいで収穫《しゅうかく》する。遅《おく》れるとかたくなり、とう立《だ》ちすることもある。',
 ei:'Bayam dipanen saat tingginya sekitar 20–25 cm. Jika terlambat, menjadi keras dan bisa bolting.'},
{id:'ys14',c:'yasai',t:'mc',
 q:'キュウリやスイカで接《つ》ぎ木苗《きなえ》を使《つか》う主《おも》な目的《もくてき》はどれか。',
 qi:'Apa tujuan utama memakai bibit sambung pada mentimun dan semangka?',
 o:['土《つち》から感染《かんせん》する病気《びょうき》に強《つよ》くする','実《み》の色《いろ》を変《か》える','種《たね》をなくす'],
 oi:['Membuat tahan terhadap penyakit yang menular dari tanah','Mengubah warna buah','Menghilangkan biji'],
 a:0,
 e:'病気《びょうき》に強《つよ》いカボチャなどを台木《だいぎ》にして接《つ》ぐと、つる割病《われびょう》など土壌病害《どじょうびょうがい》や連作障害《れんさくしょうがい》に強《つよ》くなる。',
 ei:'Dengan menyambung ke batang bawah yang tahan penyakit seperti labu, tanaman menjadi tahan penyakit tanah dan gangguan tanam berulang.'},
{id:'ys15',c:'yasai',t:'tf',
 q:'トマトのわき芽《め》は、取《と》らずにそのままにしておくほうが、実《み》が大《おお》きくなる。',
 qi:'Tunas samping tomat lebih baik dibiarkan saja agar buahnya besar.',
 a:1,
 e:'まちがい。わき芽《め》をのばすと養分《ようぶん》が分散《ぶんさん》し、葉《は》が混《こ》み合《あ》って病気《びょうき》も出《で》やすい。わき芽《め》は早《はや》めに取《と》る（芽《め》かき）。',
 ei:'Salah. Jika tunas samping dibiarkan, nutrisi terbagi dan daun menjadi rimbun sehingga mudah sakit. Tunas samping dibuang lebih awal (pewiwilan).'},
{id:'ys16',c:'yasai',t:'mc',
 q:'トマトのわき芽《め》を取《と》る作業《さぎょう》を何《なん》というか。',
 qi:'Pekerjaan membuang tunas samping tomat disebut?',
 o:['芽《め》かき','摘果《てきか》','誘引《ゆういん》'],
 oi:['Pewiwilan (membuang tunas)','Penjarangan buah','Pengikatan ke ajir'],
 a:0,
 e:'芽《め》かき＝わき芽《め》を取《と》る。摘果《てきか》＝実《み》を減《へ》らす。誘引《ゆういん》＝茎《くき》を支柱《しちゅう》にしばる。',
 ei:'Mekaki = membuang tunas samping. Tekika = mengurangi buah. Yuuin = mengikat batang ke ajir.'},
{id:'ys17',c:'yasai',t:'mc',
 q:'茎《くき》やつるを支柱《しちゅう》やネットにひもで固定《こてい》する作業《さぎょう》を何《なん》というか。',
 qi:'Pekerjaan mengikat batang atau sulur ke ajir atau jaring dengan tali disebut?',
 o:['誘引《ゆういん》','摘心《てきしん》','中耕《ちゅうこう》'],
 oi:['Pengikatan (yuuin)','Pemangkasan pucuk','Penggemburan tanah di antara tanaman'],
 a:0,
 e:'誘引《ゆういん》で茎《くき》が倒《たお》れるのを防《ふせ》ぎ、日当《ひあ》たりを良《よ》くする。ひもは茎《くき》が太《ふと》くなることを考《かんが》えて8の字《じ》にゆるく結《むす》ぶ。',
 ei:'Pengikatan mencegah batang roboh dan memperbaiki penyinaran. Tali diikat longgar berbentuk angka 8 karena batang akan membesar.'},
{id:'ys18',c:'yasai',t:'mc',
 q:'茎《くき》の先《さき》（生長点《せいちょうてん》）を摘《つ》み取《と》る作業《さぎょう》を何《なん》というか。',
 qi:'Pekerjaan memetik ujung batang (titik tumbuh) disebut?',
 o:['摘心《てきしん》','間引《まび》き','土寄《つちよ》せ'],
 oi:['Pemangkasan pucuk (tekishin)','Penjarangan tanaman','Pembumbunan'],
 a:0,
 e:'摘心《てきしん》すると上《うえ》への成長《せいちょう》が止《と》まり、わき芽《め》や実《み》に養分《ようぶん》が回《まわ》る。',
 ei:'Dengan pemangkasan pucuk, pertumbuhan ke atas berhenti dan nutrisi mengalir ke tunas samping dan buah.'},
{id:'ys19',c:'yasai',t:'mc',
 q:'芽《め》がたくさん出《で》たとき、一部《いちぶ》を抜《ぬ》いて間《あいだ》をあける作業《さぎょう》を何《なん》というか。',
 qi:'Ketika banyak tunas tumbuh, pekerjaan mencabut sebagian agar ada jarak disebut?',
 o:['間引《まび》き','誘引《ゆういん》','摘果《てきか》'],
 oi:['Penjarangan tanaman','Pengikatan','Penjarangan buah'],
 a:0,
 e:'間引《まび》きで残《のこ》した株《かぶ》に光《ひかり》・水《みず》・養分《ようぶん》が十分《じゅうぶん》いきわたる。弱《よわ》い株《かぶ》や形《かたち》の悪《わる》い株《かぶ》を抜《ぬ》く。',
 ei:'Dengan penjarangan, tanaman yang tersisa mendapat cukup cahaya, air, dan nutrisi. Cabut tanaman yang lemah atau bentuknya jelek.'},
{id:'ys20',c:'yasai',t:'tf',
 q:'土寄《つちよ》せは、株元《かぶもと》に土《つち》を寄《よ》せて、株《かぶ》が倒《たお》れないようにする作業《さぎょう》である。',
 qi:'Pembumbunan adalah pekerjaan menimbun tanah ke pangkal tanaman agar tidak roboh.',
 a:0,
 e:'正《ただ》しい。土寄《つちよ》せは倒伏《とうふく》防止《ぼうし》のほか、ジャガイモが日光《にっこう》に当《あ》たって緑《みどり》になるのを防《ふせ》ぐ目的《もくてき》もある。',
 ei:'Benar. Selain mencegah roboh, pembumbunan juga mencegah kentang menjadi hijau karena terkena sinar matahari.'},
{id:'ys21',c:'yasai',t:'mc',
 q:'畑《はたけ》に種《たね》をまくための機械《きかい》・道具《どうぐ》はどれか。',
 qi:'Mesin/alat untuk menabur benih di ladang adalah?',
 o:['シーダー（播種機《はしゅき》）','肥料散布機《ひりょうさんぷき》','刈払機《かりばらいき》'],
 oi:['Seeder (mesin penabur benih)','Mesin penyebar pupuk','Mesin pemotong rumput'],
 a:0,
 e:'シーダーは種《たね》を一定《いってい》の間隔《かんかく》でまく。肥料散布機《ひりょうさんぷき》は肥料《ひりょう》をまく、刈払機《かりばらいき》は草《くさ》を刈《か》る。',
 ei:'Seeder menabur benih dengan jarak teratur. Penyebar pupuk menebar pupuk; mesin pemotong rumput memotong rumput.'},

// ===== 施設園芸 =====
{id:'sh01',c:'shisetsu',t:'mc',
 q:'ガラス温室《おんしつ》の特徴《とくちょう》として正《ただ》しいものはどれか。',
 qi:'Manakah ciri rumah kaca (greenhouse kaca) yang benar?',
 o:['光《ひかり》をよく通《とお》し、長《なが》く使《つか》える','建設費《けんせつひ》が安《やす》く、簡単《かんたん》に移動《いどう》できる','光《ひかり》をまったく通《とお》さない'],
 oi:['Meneruskan cahaya dengan baik dan tahan lama','Biaya pembangunan murah dan mudah dipindahkan','Sama sekali tidak meneruskan cahaya'],
 a:0,
 e:'ガラスは光《ひかり》をよく通《とお》し、耐久性《たいきゅうせい》が高《たか》い（10年《ねん》以上《いじょう》）。ただし建設費《けんせつひ》は高《たか》い。安《やす》くて簡単《かんたん》なのはパイプハウス。',
 ei:'Kaca meneruskan cahaya dengan baik dan sangat tahan lama (lebih dari 10 tahun), tetapi biaya pembangunannya mahal. Yang murah dan sederhana adalah rumah pipa (pipe house).'},
{id:'sh02',c:'shisetsu',t:'tf',
 q:'パイプハウスは、鉄《てつ》パイプの骨組《ほねぐ》みをビニールなどのフィルムでおおった施設《しせつ》である。',
 qi:'Pipe house adalah fasilitas dengan rangka pipa besi yang ditutup film seperti vinil.',
 a:0,
 e:'正《ただ》しい。パイプハウスは建設費《けんせつひ》が安《やす》く、日本《にほん》でいちばん多《おお》い施設《しせつ》。フィルムは数年《すうねん》ごとに張《は》り替《か》える。',
 ei:'Benar. Pipe house biayanya murah dan paling banyak di Jepang. Filmnya diganti setiap beberapa tahun.'},
{id:'sh03',c:'shisetsu',t:'mc',
 q:'屋根《やね》の部分《ぶぶん》だけをフィルムでおおい、雨《あめ》が作物《さくもつ》に当《あ》たらないようにする施設《しせつ》はどれか。',
 qi:'Fasilitas yang hanya atapnya ditutup film agar hujan tidak mengenai tanaman adalah?',
 o:['雨《あめ》よけ施設《しせつ》','ガラス温室《おんしつ》','植物工場《しょくぶつこうじょう》'],
 oi:['Fasilitas pelindung hujan','Rumah kaca','Pabrik tanaman'],
 a:0,
 e:'雨《あめ》よけ施設《しせつ》は、雨《あめ》による病気《びょうき》や実割《みわ》れを防《ふせ》ぐ。トマトやブドウ、サクランボなどで使《つか》われる。',
 ei:'Fasilitas pelindung hujan mencegah penyakit dan buah pecah akibat hujan. Dipakai untuk tomat, anggur, ceri, dll.'},
{id:'sh04',c:'shisetsu',t:'mc',
 q:'ハウスの換気《かんき》の方法《ほうほう》の2つの種類《しゅるい》はどれか。',
 qi:'Dua jenis cara ventilasi rumah kaca/plastik adalah?',
 o:['自然換気《しぜんかんき》と強制換気《きょうせいかんき》','冷房《れいぼう》と暖房《だんぼう》','かん水《すい》と排水《はいすい》'],
 oi:['Ventilasi alami dan ventilasi paksa','Pendingin dan pemanas','Penyiraman dan pembuangan air'],
 a:0,
 e:'自然換気《しぜんかんき》＝窓《まど》や側面《そくめん》のフィルムを開《あ》けて空気《くうき》を入《い》れかえる。強制換気《きょうせいかんき》＝換気扇《かんきせん》で空気《くうき》を入《い》れかえる。',
 ei:'Ventilasi alami = membuka jendela atau film samping untuk mengganti udara. Ventilasi paksa = mengganti udara dengan kipas ventilasi.'},
{id:'sh05',c:'shisetsu',t:'tf',
 q:'天窓《てんまど》や側窓《そくまど》を開《あ》けて外《そと》の空気《くうき》を入《い》れる方法《ほうほう》は、強制換気《きょうせいかんき》である。',
 qi:'Cara memasukkan udara luar dengan membuka jendela atap atau jendela samping adalah ventilasi paksa.',
 a:1,
 e:'まちがい。窓《まど》を開《あ》ける方法《ほうほう》は自然換気《しぜんかんき》。換気扇《かんきせん》を使《つか》う方法《ほうほう》が強制換気《きょうせいかんき》。',
 ei:'Salah. Membuka jendela adalah ventilasi alami. Menggunakan kipas ventilasi adalah ventilasi paksa.'},
{id:'sh06',c:'shisetsu',t:'mc',
 q:'不織布《ふしょくふ》の使《つか》い方《かた》として正《ただ》しいものはどれか。',
 qi:'Manakah cara penggunaan kain nonwoven (fushokufu) yang benar?',
 o:['作物《さくもつ》に直接《ちょくせつ》かけて、保温《ほおん》や虫《むし》よけに使《つか》う','ハウスの骨組《ほねぐ》みに使《つか》う','肥料《ひりょう》として土《つち》に混《ま》ぜる'],
 oi:['Dipasang langsung di atas tanaman untuk menjaga kehangatan dan menghalau serangga','Dipakai sebagai rangka rumah plastik','Dicampur ke tanah sebagai pupuk'],
 a:0,
 e:'不織布《ふしょくふ》は軽《かる》く、光《ひかり》・水《みず》・空気《くうき》を通《とお》すので、作物《さくもつ》に直接《ちょくせつ》かける「べたがけ」で保温《ほおん》・防霜《ぼうそう》・防虫《ぼうちゅう》に使《つか》う。ハウスの中《なか》の保温《ほおん》カーテンにも使《つか》う。',
 ei:'Kain nonwoven ringan dan meneruskan cahaya, air, dan udara, sehingga dipasang langsung di atas tanaman ("betagake") untuk menjaga kehangatan, menahan embun beku, dan mencegah serangga. Juga dipakai sebagai tirai penghangat di dalam rumah plastik.'},
{id:'sh07',c:'shisetsu',t:'tf',
 q:'ハウスの保温効果《ほおんこうか》は、被覆資材《ひふくしざい》の種類《しゅるい》や、重《かさ》ねる枚数《まいすう》によって変《か》わる。',
 qi:'Efek penahan panas rumah plastik berubah tergantung jenis bahan penutup dan jumlah lapisannya.',
 a:0,
 e:'正《ただ》しい。外張《そとば》りに加《くわ》えて内張《うちば》り（カーテン）を重《かさ》ねると、夜《よる》の熱《ねつ》が逃《に》げにくくなり、暖房費《だんぼうひ》も減《へ》る。',
 ei:'Benar. Jika selain penutup luar ditambah penutup dalam (tirai), panas malam tidak mudah keluar dan biaya pemanas berkurang.'},
{id:'sh08',c:'shisetsu',t:'mc',
 q:'冬《ふゆ》にハウスの中《なか》を温《あたた》めるために使《つか》う機械《きかい》はどれか。',
 qi:'Mesin apa yang digunakan untuk menghangatkan bagian dalam rumah plastik di musim dingin?',
 o:['暖房機《だんぼうき》（温風暖房機《おんぷうだんぼうき》）','換気扇《かんきせん》','動力噴霧機《どうりょくふんむき》'],
 oi:['Pemanas (pemanas udara hangat)','Kipas ventilasi','Mesin semprot bermotor'],
 a:0,

 ei:'Pir dan apel sulit berbuah dengan serbuk sari dari varietas yang sama. Serbuk sari varietas lain ditempelkan ke putik dengan kuas bulu dll.'},
{id:'kj11',c:'kaju',t:'tf',
 q:'剪定《せんてい》は、枝《えだ》を切《き》って木《き》の形《かたち》を整《ととの》え、日当《ひあ》たりと風通《かぜとお》しを良《よ》くする作業《さぎょう》である。',
 qi:'Pemangkasan adalah memotong cabang untuk merapikan bentuk pohon serta memperbaiki penyinaran dan sirkulasi udara.',
 a:0,
 e:'正《ただ》しい。剪定《せんてい》で実《み》のなる枝《えだ》の量《りょう》を調整《ちょうせい》し、病害虫《びょうがいちゅう》も減《へ》らす。',
 ei:'Benar. Pemangkasan mengatur jumlah cabang yang berbuah dan juga mengurangi hama-penyakit.'},
{id:'kj12',c:'kaju',t:'mc',
 q:'落葉果樹《らくようかじゅ》の主《おも》な剪定《せんてい》（冬季剪定《とうきせんてい》）はいつ行《おこな》うか。',
 qi:'Kapan pemangkasan utama (pemangkasan musim dingin) pohon buah peluruh dilakukan?',
 o:['冬《ふゆ》、葉《は》が落《お》ちて休眠《きゅうみん》している時期《じき》','夏《なつ》、実《み》が大《おお》きくなっている時期《じき》','春《はる》、花《はな》が咲《さ》いている時期《じき》'],
 oi:['Musim dingin, saat daun gugur dan pohon dorman','Musim panas, saat buah membesar','Musim semi, saat bunga mekar'],
 a:0,
 e:'葉《は》が落《お》ちた冬《ふゆ》は枝《えだ》の形《かたち》がよく見《み》え、木《き》への負担《ふたん》も少《すく》ない。夏《なつ》に行《おこな》う軽《かる》い剪定《せんてい》は夏季剪定《かきせんてい》。',
 ei:'Di musim dingin setelah daun gugur, bentuk cabang terlihat jelas dan beban pada pohon kecil. Pemangkasan ringan di musim panas disebut pemangkasan musim panas.'},
{id:'kj13',c:'kaju',t:'mc',
 q:'剪定《せんてい》のとき、切《き》らなくてよい枝《えだ》はどれか。',
 qi:'Saat pemangkasan, cabang mana yang TIDAK perlu dipotong?',
 o:['来年《らいねん》実《み》をつける予定《よてい》の健康《けんこう》な枝《えだ》','枯《か》れた枝《えだ》','病気《びょうき》の枝《えだ》','内側《うちがわ》に向《む》かって混《こ》み合《あ》う枝《えだ》'],
 oi:['Cabang sehat yang akan berbuah tahun depan','Cabang mati','Cabang berpenyakit','Cabang yang tumbuh ke dalam dan rimbun'],
 a:0,
 e:'枯《か》れ枝《えだ》・病気《びょうき》の枝《えだ》・混《こ》み合《あ》う枝《えだ》・徒長枝《とちょうし》（勢《いきお》いよく真上《まうえ》にのびる枝《えだ》）は切《き》る。実《み》をつける健康《けんこう》な枝《えだ》は残《のこ》す。',
 ei:'Cabang mati, berpenyakit, rimbun, dan tunas air (cabang yang tumbuh kuat lurus ke atas) dipotong. Cabang sehat yang akan berbuah dibiarkan.'},
{id:'kj14',c:'kaju',t:'mc',
 q:'ウンシュウミカンの主《おも》な収穫時期《しゅうかくじき》はいつか。',
 qi:'Kapan masa panen utama jeruk unshiu?',
 o:['秋《あき》から冬《ふゆ》（10〜12月《がつ》ごろ）','春《はる》（3〜5月《がつ》ごろ）','夏《なつ》（6〜8月《がつ》ごろ）'],
 oi:['Musim gugur sampai musim dingin (sekitar Okt–Des)','Musim semi (sekitar Mar–Mei)','Musim panas (sekitar Jun–Agu)'],
 a:0,
 e:'ウンシュウミカンは品種《ひんしゅ》によって、早《はや》いものは9月《がつ》ごろから、多《おお》くは10〜12月《がつ》に収穫《しゅうかく》する。',
 ei:'Jeruk unshiu dipanen mulai sekitar September untuk varietas genjah, dan kebanyakan pada Oktober–Desember.'},
{id:'kj15',c:'kaju',t:'tf',
 q:'ブドウは、つる性《せい》の落葉果樹《らくようかじゅ》である。',
 qi:'Anggur adalah pohon buah peluruh yang merambat.',
 a:0,
 e:'正《ただ》しい。日本《にほん》では棚《たな》を作《つく》ってつるをはわせる「棚《たな》仕立《じた》て」が多《おお》い。',
 ei:'Benar. Di Jepang banyak dibuat para-para tempat sulur merambat ("tana-jitate").'},
{id:'kj16',c:'kaju',t:'mc',
 q:'種《たね》なしブドウを作《つく》るために使《つか》う植物成長調整剤《しょくぶつせいちょうちょうせいざい》はどれか。',
 qi:'Zat pengatur tumbuh yang dipakai untuk membuat anggur tanpa biji adalah?',
 o:['ジベレリン','苦土石灰《くどせっかい》','尿素《にょうそ》'],
 oi:['Giberelin','Kapur dolomit','Urea'],
 a:0,
 e:'ジベレリン液《えき》に房《ふさ》をひたす処理《しょり》をすると、種《たね》なしになり、実《み》も大《おお》きくなる。使《つか》う時期《じき》と濃度《のうど》を守《まも》ることが大切《たいせつ》。',
 ei:'Jika tandan anggur dicelupkan ke larutan giberelin, buah menjadi tanpa biji dan lebih besar. Waktu dan konsentrasi penggunaan harus dipatuhi.'},
{id:'kj17',c:'kaju',t:'tf',
 q:'果樹園《かじゅえん》で草《くさ》を生《は》やして管理《かんり》する草生栽培《そうせいさいばい》は、雨《あめ》による土《つち》の流出《りゅうしゅつ》を防《ふせ》ぐ効果《こうか》がある。',
 qi:'Budidaya dengan penutup rumput di kebun buah efektif mencegah tanah terbawa hujan.',
 a:0,
 e:'正《ただ》しい。草《くさ》の根《ね》が土《つち》をおさえ、刈《か》った草《くさ》は有機物《ゆうきぶつ》として土《つち》を良《よ》くする。ただし、定期的《ていきてき》な草刈《くさか》りが必要《ひつよう》。',
 ei:'Benar. Akar rumput menahan tanah, dan rumput yang dipotong menjadi bahan organik yang memperbaiki tanah. Namun perlu dipotong secara rutin.'},
{id:'kj18',c:'kaju',t:'mc',
 q:'収穫《しゅうかく》したリンゴを低温《ていおん》の倉庫《そうこ》で貯蔵《ちょぞう》する目的《もくてき》はどれか。',
 qi:'Apa tujuan menyimpan apel yang sudah dipanen di gudang bersuhu rendah?',
 o:['呼吸《こきゅう》をおさえて、鮮度《せんど》を長《なが》く保《たも》つ','実《み》を大《おお》きくする','皮《かわ》の色《いろ》を変《か》える'],
 oi:['Menekan respirasi agar kesegaran bertahan lama','Membuat buah lebih besar','Mengubah warna kulit'],
 a:0,
 e:'低温《ていおん》にすると果実《かじつ》の呼吸《こきゅう》がおさえられ、長期間《ちょうきかん》おいしさを保《たも》てる。CA貯蔵《ちょぞう》（酸素《さんそ》を減《へ》らす）も使《つか》われる。',
 ei:'Suhu rendah menekan respirasi buah sehingga rasanya terjaga lama. Penyimpanan CA (mengurangi oksigen) juga digunakan.'},

// ===== 安全衛生 =====
{id:'an01',c:'anzen',t:'tf',
 q:'農薬《のうやく》を散布《さんぷ》するときは、マスク・保護《ほご》メガネ・ゴム手袋《てぶくろ》・防除衣《ぼうじょい》を着用《ちゃくよう》する。',
 qi:'Saat menyemprot pestisida, gunakan masker, kacamata pelindung, sarung tangan karet, dan baju pelindung.',
 a:0,
 e:'正《ただ》しい。農薬《のうやく》は口《くち》・目《め》・皮《ひ》ふから体《からだ》に入《はい》る。肌《はだ》が出《で》ないようにする。',
 ei:'Benar. Pestisida masuk ke tubuh melalui mulut, mata, dan kulit. Pastikan kulit tidak terbuka.'},
{id:'an02',c:'anzen',t:'tf',
 q:'農薬《のうやく》は、風《かぜ》の強《つよ》い日《ひ》に散布《さんぷ》すると、早《はや》く広《ひろ》がるので効果的《こうかてき》である。',
 qi:'Pestisida lebih efektif disemprot pada hari berangin kencang karena cepat menyebar.',
 a:1,
 e:'まちがい。風《かぜ》が強《つよ》いと農薬《のうやく》が飛《と》び散《ち》り（ドリフト）、周《まわ》りの作物《さくもつ》や人《ひと》、自分《じぶん》にかかる。風《かぜ》の弱《よわ》い日《ひ》に散布《さんぷ》する。',
 ei:'Salah. Jika angin kencang, pestisida beterbangan (drift) dan mengenai tanaman lain, orang, atau diri sendiri. Semprot pada hari angin lemah.'},
{id:'an03',c:'anzen',t:'mc',
 q:'農薬《のうやく》の散布《さんぷ》の方法《ほうほう》として正《ただ》しいものはどれか。',
 qi:'Manakah cara menyemprot pestisida yang benar?',
 o:['風《かぜ》の弱《よわ》い朝《あさ》や夕方《ゆうがた》に、風上《かざかみ》から散布《さんぷ》する','暑《あつ》い日《ひ》の昼《ひる》に長時間《ちょうじかん》散布《さんぷ》する','風下《かざしも》に立《た》って、風上《かざかみ》に向《む》かって散布《さんぷ》する'],
 oi:['Menyemprot dari arah datangnya angin pada pagi atau sore saat angin lemah','Menyemprot lama pada siang hari yang panas','Berdiri di arah hilir angin dan menyemprot ke arah datangnya angin'],
 a:0,
 e:'風下《かざしも》から風上《かざかみ》に向《む》けると農薬《のうやく》が自分《じぶん》にかかる。暑《あつ》い日中《にっちゅう》は熱中症《ねっちゅうしょう》や中毒《ちゅうどく》の危険《きけん》が高《たか》い。',
 ei:'Jika menyemprot dari hilir ke arah datangnya angin, pestisida mengenai diri sendiri. Siang yang panas berisiko tinggi sengatan panas dan keracunan.'},
{id:'an04',c:'anzen',t:'tf',
 q:'農薬《のうやく》を散布《さんぷ》したあとは、手《て》や顔《かお》をよく洗《あら》い、うがいをする。',
 qi:'Setelah menyemprot pestisida, cuci tangan dan wajah dengan bersih dan berkumur.',
 a:0,
 e:'正《ただ》しい。作業着《さぎょうぎ》もほかの洗濯物《せんたくもの》と分《わ》けて洗《あら》う。散布中《さんぷちゅう》は飲食《いんしょく》・喫煙《きつえん》をしない。',
 ei:'Benar. Pakaian kerja dicuci terpisah dari cucian lain. Jangan makan, minum, atau merokok saat menyemprot.'},
{id:'an05',c:'anzen',t:'tf',
 q:'余《あま》った農薬《のうやく》の希釈液《きしゃくえき》は、川《かわ》や水路《すいろ》に捨《す》ててもよい。',
 qi:'Sisa larutan pestisida boleh dibuang ke sungai atau saluran air.',
 a:1,
 e:'まちがい。川《かわ》や水路《すいろ》に流《なが》すと、魚《さかな》や環境《かんきょう》に害《がい》がある。必要《ひつよう》な量《りょう》だけ作《つく》り、余《あま》らないようにする。',
 ei:'Salah. Jika dibuang ke sungai atau saluran, merusak ikan dan lingkungan. Buat larutan sesuai kebutuhan agar tidak bersisa.'},
{id:'an06',c:'anzen',t:'mc',
 q:'農薬《のうやく》の保管方法《ほかんほうほう》として正《ただ》しいものはどれか。',
 qi:'Manakah cara menyimpan pestisida yang benar?',
 o:['カギのかかる専用《せんよう》の場所《ばしょ》に保管《ほかん》する','食品《しょくひん》と一緒《いっしょ》に冷蔵庫《れいぞうこ》に入《い》れる','使《つか》いやすいようにペットボトルに移《うつ》す'],
 oi:['Disimpan di tempat khusus yang bisa dikunci','Disimpan di kulkas bersama makanan','Dipindahkan ke botol plastik minuman agar mudah dipakai'],
 a:0,
 e:'農薬《のうやく》は元《もと》の容器《ようき》のまま、カギのかかる保管庫《ほかんこ》に入《い》れる。ペットボトルに移《うつ》すと、まちがって飲《の》む事故《じこ》が起《お》きる。',
 ei:'Pestisida disimpan di wadah aslinya dalam lemari berkunci. Jika dipindah ke botol minuman, bisa terjadi kecelakaan karena terminum.'},
{id:'an07',c:'anzen',t:'tf',
 q:'農薬《のうやく》を飲料用《いんりょうよう》のペットボトルに移《うつ》しかえて保管《ほかん》してはいけない。',
 qi:'Pestisida tidak boleh dipindahkan ke botol minuman untuk disimpan.',
 a:0,
 e:'正《ただ》しい。誤飲事故《ごいんじこ》の原因《げんいん》になるので、絶対《ぜったい》にしてはいけない。',
 ei:'Benar. Ini penyebab kecelakaan tertelan, jadi sama sekali tidak boleh dilakukan.'},
{id:'an08',c:'anzen',t:'mc',
 q:'害虫《がいちゅう》を防《ふせ》ぐために使《つか》う農薬《のうやく》はどれか。',
 qi:'Pestisida apa yang digunakan untuk mengendalikan hama serangga?',
 o:['殺虫剤《さっちゅうざい》','殺菌剤《さっきんざい》','除草剤《じょそうざい》'],
 oi:['Insektisida','Fungisida/bakterisida','Herbisida'],
 a:0,
 e:'殺虫剤《さっちゅうざい》＝虫《むし》、殺菌剤《さっきんざい》＝病気《びょうき》（カビ・細菌《さいきん》）、除草剤《じょそうざい》＝雑草《ざっそう》。',
 ei:'Insektisida = serangga, fungisida/bakterisida = penyakit (jamur, bakteri), herbisida = gulma.'},
{id:'an09',c:'anzen',t:'mc',
 q:'雑草《ざっそう》を枯《か》らすために使《つか》う農薬《のうやく》はどれか。',
 qi:'Pestisida apa yang digunakan untuk mematikan gulma?',
 o:['除草剤《じょそうざい》','殺虫剤《さっちゅうざい》','殺菌剤《さっきんざい》'],
 oi:['Herbisida','Insektisida','Fungisida'],
 a:0,
 e:'除草剤《じょそうざい》は雑草《ざっそう》用《よう》。作物《さくもつ》にかかると作物《さくもつ》も枯《か》れることがあるので注意《ちゅうい》する。',
 ei:'Herbisida untuk gulma. Hati-hati, jika mengenai tanaman budidaya, tanaman itu juga bisa mati.'},
{id:'an10',c:'anzen',t:'mc',
 q:'カビや細菌《さいきん》による病気《びょうき》を防《ふせ》ぐために使《つか》う農薬《のうやく》はどれか。',
 qi:'Pestisida apa yang digunakan untuk mencegah penyakit akibat jamur dan bakteri?',
 o:['殺菌剤《さっきんざい》','除草剤《じょそうざい》','殺虫剤《さっちゅうざい》'],
 oi:['Fungisida/bakterisida','Herbisida','Insektisida'],
 a:0,
 e:'殺菌剤《さっきんざい》は、うどんこ病《びょう》・灰色《はいいろ》かび病《びょう》・いもち病《びょう》などに使《つか》う。',
 ei:'Fungisida dipakai untuk embun tepung, kapang kelabu, blas, dll.'},
{id:'an11',c:'anzen',t:'mc',
 q:'化学農薬《かがくのうやく》を使《つか》わない害虫《がいちゅう》の防《ふせ》ぎ方《かた》として正《ただ》しいものはどれか。',
 qi:'Manakah cara mengendalikan hama tanpa pestisida kimia yang benar?',
 o:['防虫《ぼうちゅう》ネットや天敵《てんてき》を利用《りよう》する','肥料《ひりょう》を多《おお》く与《あた》える','水《みず》やりをやめる'],
 oi:['Memakai jaring serangga atau musuh alami','Memberi banyak pupuk','Menghentikan penyiraman'],
 a:0,
 e:'防虫《ぼうちゅう》ネット・天敵《てんてき》（害虫《がいちゅう》を食《た》べる虫《むし》）・粘着《ねんちゃく》シート・輪作《りんさく》などを組《く》み合《あ》わせる方法《ほうほう》をIPM（総合的病害虫管理《そうごうてきびょうがいちゅうかんり》）という。',
 ei:'Menggabungkan jaring serangga, musuh alami (serangga pemakan hama), perangkap lengket, rotasi tanaman, dll. disebut IPM (pengendalian hama terpadu).'},
{id:'an12',c:'anzen',t:'tf',
 q:'機械《きかい》の点検《てんけん》や掃除《そうじ》は、エンジンを止《と》めてから行《おこな》う。',
 qi:'Pemeriksaan dan pembersihan mesin dilakukan setelah mesin dimatikan.',
 a:0,
 e:'正《ただ》しい。エンジンが動《うご》いたままだと、回転部《かいてんぶ》に巻《ま》き込《こ》まれる危険《きけん》がある。熱《あつ》い部分《ぶぶん》にも注意《ちゅうい》する。',
 ei:'Benar. Jika mesin masih menyala, ada bahaya terlilit bagian yang berputar. Hati-hati juga dengan bagian yang panas.'},
{id:'an13',c:'anzen',t:'tf',
 q:'動《うご》いているコンバインに草《くさ》が詰《つ》まったときは、急《いそ》いで手《て》で取《と》り除《のぞ》く。',
 qi:'Jika rumput tersangkut di combine yang sedang berjalan, segera keluarkan dengan tangan.',
 a:1,
 e:'まちがい。必《かなら》ずエンジンを止《と》め、回転《かいてん》が完全《かんぜん》に止《と》まってから、棒《ぼう》などを使《つか》って取《と》り除《のぞ》く。手《て》を入《い》れると巻《ま》き込《こ》まれる大事故《だいじこ》になる。',
 ei:'Salah. Selalu matikan mesin, tunggu sampai putaran berhenti total, lalu keluarkan dengan tongkat dll. Memasukkan tangan bisa menyebabkan kecelakaan besar karena terlilit.'},
{id:'an14',c:'anzen',t:'tf',
 q:'トラクターで道路《どうろ》を走《はし》るときは、左右《さゆう》のブレーキペダルを連結《れんけつ》する。',
 qi:'Saat traktor berjalan di jalan raya, pedal rem kiri dan kanan disambungkan.',
 a:0,
 e:'正《ただ》しい。連結《れんけつ》しないで片方《かたほう》だけブレーキがかかると、急《きゅう》に曲《ま》がって転倒《てんとう》する危険《きけん》がある。左右《さゆう》別々《べつべつ》のブレーキは畑《はたけ》で小《ちい》さく曲《ま》がるときだけ使《つか》う。',

 q:'種《たね》が発芽《はつが》するための3つの条件《じょうけん》はどれか。',
 qi:'Apa 3 syarat agar benih bertunas (berkecambah)?',
 o:['水《みず》・適当《てきとう》な温度《おんど》・酸素《さんそ》','光《ひかり》・肥料《ひりょう》・水《みず》','土《つち》・肥料《ひりょう》・二酸化炭素《にさんかたんそ》'],
 oi:['Air, suhu yang sesuai, oksigen','Cahaya, pupuk, air','Tanah, pupuk, karbon dioksida'],
 a:0,
 e:'発芽《はつが》の3条件《じょうけん》は、水《みず》・温度《おんど》・酸素《さんそ》。水《みず》が多《おお》すぎると酸素《さんそ》が足《た》りなくなり、うまく発芽《はつが》しない。',
 ei:'Tiga syarat bertunas: air, suhu, oksigen. Jika air terlalu banyak, oksigen kurang dan benih tidak bertunas dengan baik.'},
{id:'tx02',c:'kihon',t:'mc',
 q:'土《つち》の「固相《こそう》・液相《えきそう》・気相《きそう》」（三相《さんそう》）について、作物《さくもつ》がよく育《そだ》つ割合《わりあい》はどれか。',
 qi:'Tentang fase padat, cair, dan gas tanah (sistem tiga fase), berapa perbandingan yang baik untuk pertumbuhan tanaman?',
 o:['それぞれ30〜40%くらい','固相《こそう》が80%以上《いじょう》','気相《きそう》（空気《くうき》）が0%'],
 oi:['Masing-masing sekitar 30–40%','Fase padat 80% atau lebih','Fase gas (udara) 0%'],
 a:0,
 e:'固相《こそう》（土《つち》の粒《つぶ》・有機物《ゆうきぶつ》）、液相《えきそう》（水分《すいぶん》）、気相《きそう》（空気《くうき》）が、それぞれ30〜40%くらいのバランスがよい。',
 ei:'Fase padat (partikel tanah, bahan organik), fase cair (air), dan fase gas (udara) sebaiknya masing-masing sekitar 30–40%.'},
{id:'tx03',c:'kihon',t:'mc',
 q:'植物《しょくぶつ》が育《そだ》つために必《かなら》ず必要《ひつよう》な元素《げんそ》（必須元素《ひっすげんそ》）は、いくつあるか。',
 qi:'Berapa jumlah unsur yang mutlak diperlukan untuk pertumbuhan tanaman (unsur esensial)?',
 o:['16','3','100'],
 oi:['16','3','100'],
 a:0,
 e:'必須元素《ひっすげんそ》は16。そのうち窒素《ちっそ》（N）・リン酸《さん》（P）・カリ（K）が肥料《ひりょう》の三要素《さんようそ》。炭素《たんそ》・水素《すいそ》・酸素《さんそ》は空気《くうき》と水《みず》から取《と》り入《い》れる。',
 ei:'Ada 16 unsur esensial. Di antaranya nitrogen (N), fosfor (P), dan kalium (K) adalah tiga unsur pupuk. Karbon, hidrogen, dan oksigen diambil dari udara dan air.'},
{id:'tx04',c:'kihon',t:'mc',
 q:'窒素《ちっそ》・リン酸《さん》・カリの合計《ごうけい》が30%以上《いじょう》の化成肥料《かせいひりょう》を何《なん》というか。',
 qi:'Pupuk majemuk buatan yang total nitrogen, fosfor, dan kaliumnya 30% atau lebih disebut apa?',
 o:['高度化成肥料《こうどかせいひりょう》','普通化成肥料《ふつうかせいひりょう》','有機質肥料《ゆうきしつひりょう》'],
 oi:['Pupuk buatan tinggi (kadar tinggi)','Pupuk buatan biasa','Pupuk organik'],
 a:0,
 e:'合計《ごうけい》30%以上《いじょう》は高度化成肥料《こうどかせいひりょう》、30%未満《みまん》は普通化成肥料《ふつうかせいひりょう》。たとえば「10-8-8」は合計《ごうけい》26%なので普通化成肥料《ふつうかせいひりょう》。',
 ei:'Total 30% atau lebih = pupuk buatan tinggi, kurang dari 30% = pupuk buatan biasa. Misalnya "10-8-8" totalnya 26%, jadi pupuk buatan biasa.'},
{id:'tx05',c:'kihon',t:'tf',
 q:'肥料《ひりょう》を与《あた》えすぎると、土《つち》の塩類濃度《えんるいのうど》が高《たか》くなり、作物《さくもつ》の育《そだ》ちが悪《わる》くなることがある。',
 qi:'Jika pupuk diberikan berlebihan, konsentrasi garam dalam tanah meningkat dan pertumbuhan tanaman bisa terganggu.',
 a:0,
 e:'正《ただ》しい。これを塩類障害《えんるいしょうがい》という。塩類濃度《えんるいのうど》はEC（電気伝導度《でんきでんどうど》）を測《はか》って調《しら》べる。ECが高《たか》いと、肥料《ひりょう》がたくさん残《のこ》っている。',
 ei:'Benar. Ini disebut gangguan garam. Konsentrasi garam diperiksa dengan mengukur EC (daya hantar listrik). EC tinggi berarti banyak pupuk masih tersisa.'},
{id:'tx06',c:'kihon',t:'mc',
 q:'緩効性肥料《かんこうせいひりょう》の説明《せつめい》として正《ただ》しいものはどれか。',
 qi:'Manakah penjelasan yang benar tentang pupuk lepas lambat (slow-release)?',
 o:['効《き》き目《め》がゆっくり長《なが》く続《つづ》く（30〜120日くらい）','与《あた》えてすぐ効《き》き、30日くらいで効《き》き目《め》が終《お》わる','肥料《ひりょう》の成分《せいぶん》がまったく入《はい》っていない'],
 oi:['Efeknya berlangsung pelan dan lama (sekitar 30–120 hari)','Langsung berefek dan habis dalam sekitar 30 hari','Sama sekali tidak mengandung unsur pupuk'],
 a:0,
 e:'速効性肥料《そっこうせいひりょう》＝すぐ効《き》いて30日くらいまで。緩効性肥料《かんこうせいひりょう》＝30〜120日くらい長《なが》く効《き》く。元肥《もとごえ》には主《おも》に緩効性《かんこうせい》、追肥《ついひ》には速効性《そっこうせい》を使《つか》う。',
 ei:'Pupuk cepat kerja = langsung berefek sampai sekitar 30 hari. Pupuk lepas lambat = berefek lama sekitar 30–120 hari. Untuk pupuk dasar terutama dipakai yang lepas lambat, untuk pupuk susulan yang cepat kerja.'},
{id:'tx07',c:'kihon',t:'mc',
 q:'日本《にほん》の土性《どせい》（土《つち》の種類《しゅるい》）の分《わ》け方《かた》で、粘土《ねんど》をいちばん多《おお》く含《ふく》む土《つち》はどれか。',
 qi:'Dalam klasifikasi tekstur tanah di Jepang, tanah mana yang paling banyak mengandung tanah liat?',
 o:['埴土《しょくど》','砂土《さど》','壌土《じょうど》'],
 oi:['Lempung (shokudo)','Pasir (sado)','Geluh (joudo)'],
 a:0,
 e:'粘土《ねんど》の割合《わりあい》で5つに分《わ》ける。埴土《しょくど》は粘土《ねんど》が50%以上《いじょう》で、肥料《ひりょう》をよく保《たも》つが水《みず》はけが悪《わる》い。多《おお》くの作物《さくもつ》に合《あ》うのは壌土《じょうど》・埴壌土《しょくじょうど》。',
 ei:'Tanah dibagi 5 menurut persentase tanah liat. Lempung mengandung tanah liat 50% atau lebih, menahan pupuk dengan baik tetapi drainasenya buruk. Yang cocok untuk banyak tanaman adalah geluh dan geluh lempung.'},

// ===== 畑作・野菜 =====
{id:'tx08',c:'yasai',t:'mc',
 q:'次《つぎ》のうち、種《たね》の寿命《じゅみょう》が短《みじか》い（1〜2年くらい）野菜《やさい》はどれか。',
 qi:'Manakah sayuran yang usia benihnya pendek (sekitar 1–2 tahun)?',
 o:['ニンジン','トマト','ナス'],
 oi:['Wortel','Tomat','Terong'],
 a:0,
 e:'ニンジン・トウモロコシ・ホウレンソウは1〜2年。ネギ・タマネギ・ダイコン・キャベツは2〜3年。トマト・ナスは3〜4年。',
 ei:'Wortel, jagung, bayam: 1–2 tahun. Bawang daun, bawang bombai, lobak, kol: 2–3 tahun. Tomat, terong: 3–4 tahun.'},
{id:'tx09',c:'yasai',t:'tf',
 q:'種《たね》は、温度《おんど》が低《ひく》く、乾燥《かんそう》した場所《ばしょ》で保存《ほぞん》する。',
 qi:'Benih disimpan di tempat yang suhunya rendah dan kering.',
 a:0,
 e:'正《ただ》しい。保存《ほぞん》の条件《じょうけん》が悪《わる》いと、種《たね》が使《つか》える期間《きかん》が短《みじか》くなる。',
 ei:'Benar. Jika kondisi penyimpanan buruk, masa pakai benih menjadi lebih pendek.'},
{id:'tx10',c:'yasai',t:'mc',
 q:'地温《ちおん》（土《つち》の温度《おんど》）が上《あ》がるのをおさえるマルチはどれか。',
 qi:'Mulsa apa yang mencegah suhu tanah naik?',
 o:['白《しろ》マルチ','透明《とうめい》マルチ','緑《みどり》マルチ'],
 oi:['Mulsa putih','Mulsa bening','Mulsa hijau'],
 a:0,
 e:'白《しろ》マルチは地温《ちおん》の上昇《じょうしょう》をおさえる（夏《なつ》向《む》き）。透明《とうめい》はいちばん地温《ちおん》が上《あ》がる。緑《みどり》は透明《とうめい》と黒《くろ》の中間《ちゅうかん》で、雑草《ざっそう》もおさえる。',
 ei:'Mulsa putih mencegah suhu tanah naik (cocok untuk musim panas). Bening paling menaikkan suhu tanah. Hijau di antara bening dan hitam, juga menekan gulma.'},
{id:'tx11',c:'yasai',t:'tf',
 q:'使《つか》い終《お》わったマルチやトンネルのフィルムは、畑《はたけ》で燃《も》やして処分《しょぶん》してよい。',
 qi:'Mulsa dan plastik terowongan yang sudah dipakai boleh dibakar di lahan.',
 a:1,
 e:'まちがい。有害《ゆうがい》なガスが出《で》るおそれがあるので、畑《はたけ》で燃《も》やすことは法律《ほうりつ》で禁止《きんし》されている。専門《せんもん》の業者《ぎょうしゃ》に処理《しょり》を頼《たの》む。',
 ei:'Salah. Karena bisa menghasilkan gas berbahaya, membakarnya di lahan dilarang undang-undang. Minta ahli/perusahaan khusus untuk menanganinya.'},

// ===== 稲作 =====
{id:'tx12',c:'ine',t:'mc',
 q:'催芽《さいが》（種《たね》もみの芽《め》を出《だ》させる作業《さぎょう》）のときの温度《おんど》として正《ただ》しいものはどれか。',
 qi:'Berapa suhu yang benar saat mempercepat pertunasan benih padi?',
 o:['30〜32℃','10〜15℃','50〜60℃'],
 oi:['30–32°C','10–15°C','50–60°C'],
 a:0,
 e:'種《たね》まきの前《まえ》の日《ひ》に、30〜32℃で温《あたた》めて、芽《め》が1mmくらいの「はと胸《むね》」にする。10〜15℃は浸種《しんしゅ》のときの水温《すいおん》。',
 ei:'Sehari sebelum penanaman benih, dihangatkan pada 30–32°C sampai tunas sekitar 1 mm (bentuk dada merpati). 10–15°C adalah suhu air saat perendaman benih.'},
{id:'tx13',c:'ine',t:'mc',
 q:'育苗箱《いくびょうばこ》で育《そだ》てる稚苗《ちびょう》は、種《たね》まきから何日《なんにち》くらいで田植《たう》えに使《つか》うか。',
 qi:'Bibit muda yang ditumbuhkan di kotak pembibitan dipakai untuk tanam setelah sekitar berapa hari dari penanaman benih?',
 o:['20〜25日','5日くらい','60日以上《いじょう》'],
 oi:['20–25 hari','Sekitar 5 hari','60 hari atau lebih'],
 a:0,
 e:'稚苗《ちびょう》は20〜25日、中苗《ちゅうびょう》は30〜35日くらい育《そだ》てる。',
 ei:'Bibit muda ditumbuhkan sekitar 20–25 hari, bibit sedang sekitar 30–35 hari.'},
{id:'tx14',c:'ine',t:'mc',
 q:'稲《いね》の穂肥《ほごえ》（穂《ほ》のための追肥《ついひ》）を与《あた》える時期《じき》はいつか。',
 qi:'Kapan pupuk malai (pupuk susulan untuk malai) padi diberikan?',
 o:['穂《ほ》が出《で》る15〜25日くらい前《まえ》','田植《たう》えの日《ひ》','収穫《しゅうかく》のあと'],
 oi:['Sekitar 15–25 hari sebelum malai keluar','Pada hari tanam','Setelah panen'],
 a:0,
 e:'出穂《しゅっすい》の15〜25日くらい前《まえ》に、窒素《ちっそ》とカリを与《あた》える。もみの数《かず》を増《ふ》やし、もみが育《そだ》たなくなるのを防《ふせ》ぐ。',
 ei:'Sekitar 15–25 hari sebelum malai keluar, diberikan nitrogen dan kalium. Untuk memperbanyak gabah dan mencegah gabah tidak berkembang.'},
{id:'tx15',c:'ine',t:'tf',
 q:'田植機《たうえき》で植《う》えるとき、条間《じょうかん》（列《れつ》と列《れつ》の間《あいだ》）はふつう30cmくらいである。',
 qi:'Saat menanam dengan mesin tanam padi, jarak antar baris biasanya sekitar 30 cm.',
 a:0,
 e:'正《ただ》しい。条間《じょうかん》は30cmくらい。株間《かぶま》（株《かぶ》と株《かぶ》の間《あいだ》）は田植機《たうえき》で10〜30cmくらいに調整《ちょうせい》する。',
 ei:'Benar. Jarak antar baris sekitar 30 cm. Jarak antar rumpun diatur dengan mesin sekitar 10–30 cm.'},

// ===== 施設園芸 =====
{id:'tx16',c:'shisetsu',t:'mc',
 q:'ハウスの自然換気《しぜんかんき》をするときの順番《じゅんばん》として正《ただ》しいものはどれか。',
 qi:'Manakah urutan yang benar saat melakukan ventilasi alami di rumah kaca?',
 o:['内張《うちば》り（カーテン）→ 天窓《てんまど》 → 側窓《そくそう》','換気扇《かんきせん》 → 側窓《そくそう》 → 天窓《てんまど》','側窓《そくそう》 → 天窓《てんまど》 → 内張《うちば》り'],
 oi:['Penutup dalam (gorden) → jendela atap → jendela samping','Kipas → jendela samping → jendela atap','Jendela samping → jendela atap → penutup dalam'],
 a:0,
 e:'まず内張《うちば》りを開《あ》け、次《つぎ》に天窓《てんまど》、まだ暑《あつ》ければ側窓《そくそう》を開《あ》ける。それでも温度《おんど》が下《さ》がらないときに、換気扇《かんきせん》で強制換気《きょうせいかんき》をする。',
 ei:'Pertama buka penutup dalam, lalu jendela atap, jika masih panas buka jendela samping. Jika suhu tetap tidak turun, lakukan ventilasi paksa dengan kipas.'},
{id:'tx17',c:'shisetsu',t:'tf',
 q:'農業用《のうぎょうよう》ポリエチレンフィルムは、農業用《のうぎょうよう》塩化《えんか》ビニルフィルムより保温性《ほおんせい》が高《たか》い。',
 qi:'Plastik polietilen pertanian lebih tinggi kemampuan menahan panasnya daripada plastik vinil klorida pertanian.',
 a:1,
 e:'まちがい。保温性《ほおんせい》が高《たか》いのは塩化《えんか》ビニルフィルム。ポリエチレンフィルムは保温性《ほおんせい》が低《ひく》い。塩化《えんか》ビニルは重《おも》く、1〜2年ごとに張《は》り替《か》える。',
 ei:'Salah. Yang tinggi kemampuan menahan panasnya adalah vinil klorida. Polietilen rendah kemampuan menahan panasnya. Vinil klorida berat dan diganti setiap 1–2 tahun.'},

// ===== 安全衛生 =====
{id:'tx18',c:'anzen',t:'mc',
 q:'乗用《じょうよう》トラクターに乗《の》り降《お》りするとき、どちら側《がわ》から行《おこな》うか。',
 qi:'Dari sisi mana naik dan turun traktor yang dikendarai?',
 o:['左側《ひだりがわ》','右側《みぎがわ》','後《うし》ろ側《がわ》'],
 oi:['Sisi kiri','Sisi kanan','Sisi belakang'],
 a:0,
 e:'トラクターの乗《の》り降《お》りは左側《ひだりがわ》から。走行中《そうこうちゅう》は左右《さゆう》のブレーキペダルを連結《れんけつ》する。作業《さぎょう》のあとは燃料《ねんりょう》を満《まん》タンにしておく。',
 ei:'Naik dan turun traktor dari sisi kiri. Saat melaju, sambungkan pedal rem kiri dan kanan. Setelah bekerja, isi penuh tangki bahan bakar.'},
{id:'tx19',c:'anzen',t:'tf',
 q:'脚立《きゃたつ》を使《つか》うとき、いちばん上《うえ》の天板《てんばん》に乗《の》って作業《さぎょう》してもよい。',
 qi:'Saat memakai tangga lipat, boleh bekerja dengan naik ke papan paling atas.',
 a:1,
 e:'まちがい。天板《てんばん》に乗《の》ったり、またがったりしてはいけない。使《つか》う前《まえ》に傷《きず》やゆがみを点検《てんけん》し、開《ひら》き止《ど》めを必《かなら》ずかける。',
 ei:'Salah. Jangan naik atau menunggangi papan atas. Sebelum dipakai, periksa retak atau bengkok, dan pasang pengunci bukaan.'},
{id:'tx20',c:'anzen',t:'mc',
 q:'歩行型《ほこうがた》の耕《こう》うん機《き》や田植機《たうえき》で、多《おお》く使《つか》われる燃料《ねんりょう》はどれか。',
 qi:'Bahan bakar apa yang banyak digunakan pada traktor tangan dan mesin tanam padi?',
 o:['ガソリン','軽油《けいゆ》','重油《じゅうゆ》'],
 oi:['Bensin','Solar (minyak ringan)','Minyak berat'],
 a:0,
 e:'ガソリン＝耕《こう》うん機《き》・田植機《たうえき》など。軽油《けいゆ》＝トラクター・コンバインなど。混合《こんごう》ガソリン＝刈払機《かりばらいき》。重油《じゅうゆ》・灯油《とうゆ》＝穀物乾燥機《こくもつかんそうき》・暖房機《だんぼうき》。機械《きかい》ごとに必《かなら》ず確認《かくにん》する。',
 ei:'Bensin = traktor tangan, mesin tanam padi, dll. Solar = traktor, combine, dll. Bensin campuran = mesin pemotong rumput. Minyak berat/minyak tanah = pengering biji-bijian, pemanas. Selalu periksa untuk setiap mesin.'},
{id:'tx21',c:'anzen',t:'mc',
 q:'軽油《けいゆ》をプラスチック容器《ようき》に入《い》れて保管《ほかん》するとき、入《い》れてよい量《りょう》はどれか。',
 qi:'Saat menyimpan solar di wadah plastik, berapa jumlah yang boleh dimasukkan?',
 o:['30Lまで','100Lまで','何《なん》Lでもよい'],
 oi:['Sampai 30 L','Sampai 100 L','Berapa pun boleh'],
 a:0,

const STORE_KEY = 'nougyou_exam_v1';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

const RUBY_RE = /([一-鿿々ヶ]+)《([^》]+)》/g;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function R(t) {   // ふりがな付きの日本語
  const s = esc(t || '');
  return DB.set.furi ? s.replace(RUBY_RE, '<ruby>$1<rt>$2</rt></ruby>') : s.replace(RUBY_RE, '$1');
}
function plain(t) { return String(t || '').replace(RUBY_RE, '$1'); }
function ID(t, tag) { return DB.set.idn && t ? `<span class="idn">${esc(t)}</span>` : ''; }
function catName(c) { return R(CATS[c].ja); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }
const NUMS = ['①','②','③','④','⑤'];

function toggleSet(k) {

const HAS_TTS = 'speechSynthesis' in window;
let jaVoice = null;
function loadVoices() {
  if (!HAS_TTS) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => v.lang === 'ja-JP') || vs.find(v => (v.lang || '').toLowerCase().startsWith('ja')) || null;
}
if (HAS_TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate) {
  if (!HAS_TTS) { toast('この端末では音声が使えません'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(RUBY_RE, '$2')); // 漢字は読みで読ませる
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = rate || 0.9;
  speechSynthesis.speak(u);
}
function stopSpeak() { if (HAS_TTS) speechSynthesis.cancel(); }

// =====================================================================
//  復習スケジュール（間隔反復）
// =====================================================================
function record(q, ok) {
  const now = Date.now();
  const r = DB.srs[q.id] || { box: 0, due: 0, ok: 0, ng: 0 };
  if (ok) {
    r.ok++;
    r.box = r.box === 0 ? 2 : Math.min(r.box + 1, 5);
    r.due = now + INTERVAL_DAYS[r.box] * DAY;
  } else {
    r.ng++;
    r.box = 1;
    r.due = now;           // まちがえた問題はすぐ「復習」に入る
  }
  DB.srs[q.id] = r;
  save();
}
function dueList() {
  const now = Date.now();
  return Object.entries(DB.srs)
    .filter(([id, r]) => QMAP[id] && r.due <= now)
    .sort((a, b) => a[1].box - b[1].box || a[1].due - b[1].due)
    .map(([id]) => QMAP[id]);
}
function catStats(c) {
  let ok = 0, ng = 0, seen = 0, mastered = 0, total = 0;
  QUESTIONS.forEach(q => {
    if (c && q.c !== c) return;
    total++;
    const r = DB.srs[q.id];
    if (r) { ok += r.ok; ng += r.ng; seen++; if (r.box >= 4) mastered++; }
  });
  return { ok, ng, seen, mastered, total, pct: ok + ng ? Math.round(ok / (ok + ng) * 100) : null };
}

// ---------- セッション作成 ----------
function makeSession(mode, qs, title, limitMin) {
  return {
    mode, title, finished: false,
    items: qs.map(q => ({ q, order: q.t === 'tf' ? [0, 1] : shuffle(q.o.map((_, i) => i)), pick: null, done: false })),
    idx: 0, startedAt: Date.now(), limit: limitMin ? limitMin * 60 * 1000 : 0,
  };
}
function startPractice() {
  let pool = QUESTIONS.filter(q => srcOk(q, SETUP.src) && (SETUP.cat === 'all' || q.c === SETUP.cat));
  if (!pool.length) { toast('この条件の問題はありません'); return; }
  pool = shuffle(pool);
  if (SETUP.prio) {
    const key = q => { const r = DB.srs[q.id]; return r ? (r.box <= 1 ? 1 : r.box + 1) : 0; }; // 未学習→苦手→その他
    pool.sort((a, b) => key(a) - key(b));
  }
  const n = SETUP.n || pool.length;
  const qs = shuffle(pool.slice(0, n));
  S = makeSession('practice', qs, SETUP.cat === 'all' ? 'すべて' : plain(CATS[SETUP.cat].ja));
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}
function startReview() {
  const qs = dueList().slice(0, 30);
  if (!qs.length) return;
  S = makeSession('review', shuffle(qs), '復習');
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}
function startMock() {
  if (!confirm(`模擬試験をはじめます。\n60問・${MOCK_MINUTES}分。答えと解説は最後に表示されます。\n\nMulai ujian simulasi? (60 soal, ${MOCK_MINUTES} menit)`)) return;
  let knowledge = [], listening = [];
  Object.entries(MOCK_PLAN).forEach(([c, n]) => {
    const picked = shuffle(QUESTIONS.filter(q => q.c === c)).slice(0, n);
    (c === 'choukai' ? listening : knowledge).push(...picked);
  });
  S = makeSession('mock', [...shuffle(knowledge), ...listening], '模擬試験', MOCK_MINUTES);
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); startTimer();
}

// ---------- タイマー ----------
function startTimer() {
  endTimer();
  timerId = setInterval(() => {
    if (!S || S.mode !== 'mock') return endTimer();
    const left = S.limit - (Date.now() - S.startedAt);
    const el = document.getElementById('timer');
    if (el) { el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 5 * 60 * 1000); }
    if (left <= 0) { endTimer(); toast('時間です / Waktu habis'); finish(); }
  }, 1000);
}
function endTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function fmtTime(ms) { ms = Math.max(0, ms); const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000); return m + ':' + String(s).padStart(2, '0'); }
